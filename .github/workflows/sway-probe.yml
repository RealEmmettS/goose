name: Native Sway adapter

on:
  workflow_dispatch:
  push:
    branches: [codex/goose-sway-integration]
    paths: ['script/smoke_sway*', '.github/workflows/sway-probe.yml', 'crates/**', 'src/**', 'settings/**']

permissions:
  contents: read

jobs:
  premise:
    name: Sway (${{ matrix.distribution }}, ${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        distribution: ['ubuntu:24.04', 'debian:trixie-slim']
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: '1.95'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          architecture: ${{ matrix.runner == 'ubuntu-24.04-arm' && 'arm64' || 'x64' }}
      - name: Build the actual bounded Rust observer
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libasound2-dev
          cargo test --locked -p honk-platform-linux --lib
          cargo test --locked --bin honk300 integrations
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo build --locked --release -p honk-platform-linux --example sway_bridge_probe
          cargo build --locked --release --bin honk300
      - name: Build the production Native SDK settings companion
        run: |
          sudo apt-get install --no-install-recommends -y libgtk-4-dev pkg-config
          target="$(uname -m)-unknown-linux-gnu"
          python3 script/build_settings.py --target "$target" --output target/release --test
      - name: Exercise the actual private compositor
        env:
          HONK_DISTRIBUTION: ${{ matrix.distribution }}
        run: |
          docker run --rm -e HONK_HOST_UID="$(id -u)" -e HONK_HOST_GID="$(id -g)" \
            -v "$PWD:/work" -w /work "$HONK_DISTRIBUTION" bash -euc '
            mkdir -p target/sway-evidence
            trap '\''chown -R "$HONK_HOST_UID:$HONK_HOST_GID" /work/target/sway-evidence'\'' EXIT
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install --no-install-recommends -y \
              sway dbus-x11 python3 python3-gi gir1.2-gtk-4.0 libgtk-4-1 \
              libgl1-mesa-dri libcap2-bin util-linux passwd libasound2t64 \
              at-spi2-core gir1.2-atspi-2.0
            dpkg-query -W > target/sway-evidence/packages.txt
            compositor="$(command -v sway)"
            getcap "$compositor" > target/sway-evidence/container-file-capabilities.txt
            if test -s target/sway-evidence/container-file-capabilities.txt; then setcap -r "$compositor"; fi
            useradd --create-home honkprobe
            chown -R honkprobe:honkprobe /work/target/sway-evidence
            runuser -u honkprobe -- env GITHUB_ACTIONS=true dbus-run-session -- \
              python3 script/smoke_sway_adapter.py --evidence target/sway-evidence \
                --bridge target/release/examples/sway_bridge_probe \
                --goose target/release/honk300 --settings target/release/honk300-settings
          '
      - uses: actions/upload-artifact@v6
        if: ${{ always() }}
        with:
          name: sway-${{ strategy.job-index }}
          path: target/sway-evidence
          if-no-files-found: warn
