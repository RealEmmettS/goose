name: Post-release Installer Smoke

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Published immutable stable tag to verify, for example v1.0.1"
        required: true
        type: string

permissions:
  contents: read

jobs:
  unix-managed-install:
    name: live managed install (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            linux: true
            slug: linux-x86_64
          - runner: ubuntu-22.04-arm
            linux: true
            slug: linux-aarch64
          - runner: macos-15
            linux: false
            slug: macos-arm64
          - runner: macos-15-intel
            linux: false
            slug: macos-x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - name: Install Linux compositor qualification packages
        if: ${{ matrix.linux }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            grim imagemagick libasound2-dev openbox python3 sway swaybg x11-utils \
            x11-xserver-utils xcompmgr xvfb
      - name: Install twice and prove complete rollback from live assets
        env:
          HONK300_SMOKE_TAG: ${{ inputs.tag }}
          HONK300_RUN_LINUX_OVERLAY_SMOKE: ${{ matrix.linux }}
          HONK300_LINUX_EVIDENCE_DIR: ${{ github.workspace }}/target/post-release-linux-overlay-${{ matrix.slug }}
        shell: bash
        run: sh script/smoke_released_unix.sh "$HONK300_SMOKE_TAG"
      - name: Upload published Linux exact-install compositor evidence
        if: ${{ always() && matrix.linux }}
        uses: actions/upload-artifact@v6
        with:
          name: honk300-linux-overlay-published-${{ matrix.slug }}-${{ inputs.tag }}
          path: target/post-release-linux-overlay-${{ matrix.slug }}
          if-no-files-found: error

  windows-global-msi:
    name: live Global MSI rollback and lifecycle (${{ matrix.triple }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            triple: x86_64-pc-windows-msvc
          - runner: windows-11-arm
            triple: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - name: Prove native rollback, upgrade, repair, PE identity, compositor, and uninstall
        env:
          HONK300_SMOKE_TAG: ${{ inputs.tag }}
        shell: pwsh
        run: |
          ./script/smoke_released_windows.ps1 `
            -Tag $env:HONK300_SMOKE_TAG `
            -TargetTriple '${{ matrix.triple }}' `
            -AllowUnobservableTrayRecoveryHost:('${{ matrix.triple }}' -eq 'x86_64-pc-windows-msvc') `
            -OverlayEvidenceDirectory 'target/post-release-windows-overlay-${{ matrix.triple }}'
      - name: Download exact public managed installers and qualify takeover
        timeout-minutes: 30
        env:
          HONK300_SMOKE_TAG: ${{ inputs.tag }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:HONK300_SMOKE_TAG
          $version = $tag.TrimStart('v')
          $triple = '${{ matrix.triple }}'
          $stage = Join-Path $env:RUNNER_TEMP "honk300-public-takeover-$triple"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          function Get-VerifiedAsset([string] $name) {
            $asset = Join-Path $stage $name
            $sidecar = "$asset.sha256"
            $base = "https://github.com/RealEmmettS/goose/releases/download/$tag"
            Invoke-WebRequest -UseBasicParsing "$base/$name" -OutFile $asset -MaximumRetryCount 4 -RetryIntervalSec 2
            Invoke-WebRequest -UseBasicParsing "$base/$name.sha256" -OutFile $sidecar -MaximumRetryCount 4 -RetryIntervalSec 2
            $expected = ((Get-Content -LiteralPath $sidecar -Raw).Trim() -split '\s+')[0].ToLowerInvariant()
            $actual = (Get-FileHash -LiteralPath $asset -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($expected -notmatch '^[0-9a-f]{64}$' -or $actual -ne $expected) {
              throw "public checksum mismatch for $name"
            }
            $latest = Join-Path $stage "latest-$name"
            $latestSidecar = "$latest.sha256"
            $latestBase = 'https://github.com/RealEmmettS/goose/releases/latest/download'
            Invoke-WebRequest -UseBasicParsing "$latestBase/$name" -OutFile $latest -MaximumRetryCount 4 -RetryIntervalSec 2
            Invoke-WebRequest -UseBasicParsing "$latestBase/$name.sha256" -OutFile $latestSidecar -MaximumRetryCount 4 -RetryIntervalSec 2
            $latestExpected = ((Get-Content -LiteralPath $latestSidecar -Raw).Trim() -split '\s+')[0].ToLowerInvariant()
            $latestActual = (Get-FileHash -LiteralPath $latest -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($latestExpected -ne $actual -or $latestActual -ne $actual) {
              throw "latest alias does not identify exact $tag bytes for $name"
            }
            return $asset
          }
          $globalMsi = Get-VerifiedAsset "honk300-$triple.msi"
          $corporateMsi = Get-VerifiedAsset "honk300-$triple-corporate.msi"
          $globalExe = Get-VerifiedAsset "honk300-$triple-setup.exe"
          $corporateExe = Get-VerifiedAsset "honk300-$triple-corporate-setup.exe"
          $powerShellInstaller = Get-VerifiedAsset 'honk300-installer.ps1'
          ./script/smoke_windows_installer_takeover.ps1 `
            -GlobalMsi $globalMsi `
            -CorporateMsi $corporateMsi `
            -GlobalExe $globalExe `
            -CorporateExe $corporateExe `
            -PowerShellInstaller $powerShellInstaller `
            -ExpectedVersion $version `
            -EvidenceDirectory "target/post-release-windows-takeover-$triple" `
            -AllowMachineMutation
      - name: Upload published Windows overlay qualification evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: honk300-windows-overlay-published-${{ matrix.triple }}-${{ inputs.tag }}
          path: target/post-release-windows-overlay-${{ matrix.triple }}
          if-no-files-found: error
      - name: Upload published Windows installer takeover evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: honk300-windows-takeover-published-${{ matrix.triple }}-${{ inputs.tag }}
          path: target/post-release-windows-takeover-${{ matrix.triple }}
          if-no-files-found: error

  debian-package:
    name: live Debian package (${{ matrix.architecture }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            architecture: amd64
          - runner: ubuntu-22.04-arm
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - name: Install Debian and compositor qualification prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            grim imagemagick libasound2-dev openbox python3 sway swaybg x11-utils \
            x11-xserver-utils xcompmgr xvfb
      - name: Prove stable latest package, aliases, compositor, update, uninstall, and purge
        env:
          HONK300_SMOKE_TAG: ${{ inputs.tag }}
          HONK300_DEB_EVIDENCE_DIR: ${{ github.workspace }}/target/post-release-deb-${{ matrix.architecture }}
        shell: bash
        run: sh script/smoke_released_deb.sh "$HONK300_SMOKE_TAG"
      - name: Upload published Debian package evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: honk300-debian-published-${{ matrix.architecture }}-${{ inputs.tag }}
          path: target/post-release-deb-${{ matrix.architecture }}
          if-no-files-found: error
