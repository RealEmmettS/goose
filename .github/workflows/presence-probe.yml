name: Native macOS presence

on:
  workflow_dispatch:
    inputs:
      focus_premise:
        description: 'Run the still-unqualified private Focus authorization experiment'
        type: boolean
        default: false
  workflow_call:
    inputs:
      commit:
        required: true
        type: string
  pull_request:
    paths: ['crates/honk-platform-macos/**', 'crates/honk-control/**', 'src/runtime/**', 'src/settings/**', 'script/*macos_presence*', '.github/workflows/presence-probe.yml']
  push:
    branches: [main, codex/goose-presence-observation]
    paths: ['crates/honk-platform-macos/**', 'crates/honk-control/**', 'src/runtime/**', 'src/settings/**', 'script/*macos_presence*', '.github/workflows/presence-probe.yml']

permissions:
  contents: read

jobs:
  macos:
    name: macOS presence (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ inputs.commit || github.sha }}
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.95.0
      - name: Check and build the actual native Rust runtime
        run: |
          cargo clippy --locked --all-targets --workspace -- -D warnings
          cargo test --locked --workspace
          cargo build --locked --release
      - name: Build the native observer and isolated fullscreen fixture
        run: |
          mkdir -p target/presence-evidence
          swiftc script/probe_macos_presence.swift -o target/presence-probe
      - name: Observe actual fullscreen transitions without requesting permission
        run: target/presence-probe observe "$PWD/target/presence-evidence"
      - name: Exercise actual fullscreen, live settings, interrupted target and graceful shutdown
        run: python3 script/smoke_macos_presence.py --binary target/release/honk300 --fixture target/presence-probe --evidence target/presence-evidence/runtime
      - name: Prove denied observations from a private uninstalled app identity
        run: python3 script/smoke_macos_presence_denied.py --binary target/release/honk300 --evidence target/presence-evidence/denied
      - name: Probe documented Focus authorization in a private bundle
        if: ${{ inputs.focus_premise == true }}
        run: |
          app="$PWD/target/HonkPresenceProbe.app"
          mkdir -p "$app/Contents/MacOS"
          cp target/presence-probe "$app/Contents/MacOS/HonkPresenceProbe"
          python3 - "$app/Contents/Info.plist" <<'PY'
          import plistlib,sys
          with open(sys.argv[1], 'wb') as output:
              plistlib.dump(dict(CFBundleIdentifier='dev.emmetts.honk300.presenceprobe',
                  CFBundleName='Honk300 native presence probe', CFBundleExecutable='HonkPresenceProbe',
                  CFBundlePackageType='APPL', CFBundleVersion='1',
                  NSFocusStatusUsageDescription='This disposable qualification probe checks whether macOS supplies an authorized Focus observation.'), output)
          PY
          codesign --force --sign - "$app"
          /usr/bin/open -n -W --env GITHUB_ACTIONS=true "$app" --args focus "$PWD/target/presence-evidence"
          python3 - "$PWD/target/presence-evidence/focus.json" <<'PY'
          import json,sys
          result=json.load(open(sys.argv[1]))
          assert result['stage'] == 'request-returned', result
          PY
      - uses: actions/upload-artifact@v6
        if: ${{ always() }}
        with:
          name: presence-${{ matrix.runner }}
          path: target/presence-evidence
          if-no-files-found: warn
