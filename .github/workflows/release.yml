name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing immutable stable tag, for example v0.3.0"
        required: true
        type: string
      commit:
        description: "Full 40-character commit SHA named by the tag"
        required: true
        type: string
      candidate:
        description: "Build and fully verify without requiring a tag or publishing a release"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-22.04
    outputs:
      manifest: ${{ steps.plan.outputs.manifest }}
      tag: ${{ steps.release.outputs.tag }}
      commit: ${{ steps.release.outputs.commit }}
    steps:
      - name: Resolve immutable release identity
        id: release
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_COMMIT: ${{ inputs.commit }}
          REF_TAG: ${{ github.ref_name }}
          REF_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            tag="$INPUT_TAG"
            commit="$INPUT_COMMIT"
          else
            tag="$REF_TAG"
            commit="$REF_COMMIT"
          fi
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "unstable tag: $tag" >&2; exit 1; }
          [[ "$commit" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "invalid commit: $commit" >&2; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "commit=${commit,,}" >> "$GITHUB_OUTPUT"

      - name: Checkout exact release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.release.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove tag, commit, checkout, and package version agree
        shell: bash
        env:
          CANDIDATE: ${{ inputs.candidate || false }}
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          test "$(git rev-parse HEAD)" = '${{ steps.release.outputs.commit }}'
          if [ "$CANDIDATE" = true ]; then
            if git show-ref --verify --quiet 'refs/tags/${{ steps.release.outputs.tag }}'; then
              echo "candidate tag already exists; use release mode or a new patch version" >&2
              exit 1
            fi
          else
            test "$(git rev-parse '${{ steps.release.outputs.tag }}^{commit}')" = "$(git rev-parse HEAD)"
          fi
          version="$(sed -n '/^\[package\]$/,/^\[/s/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          test "v$version" = '${{ steps.release.outputs.tag }}'

      - name: Install pinned cargo-dist
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.cargo/bin"
          archive="$(mktemp)"
          trap 'rm -f "$archive"' EXIT
          curl --proto '=https' --tlsv1.2 -fL --retry 6 --retry-all-errors --retry-delay 5 \
            https://github.com/axodotdev/cargo-dist/releases/download/v0.31.0/cargo-dist-x86_64-unknown-linux-gnu.tar.xz \
            -o "$archive"
          echo "cd355dab0b4c02fb59038fef87655550021d07f45f1d82f947a34ef98560abb8  $archive" \
            | sha256sum -c -
          tar -xJf "$archive" -C "$HOME/.cargo/bin" --strip-components=1 \
            cargo-dist-x86_64-unknown-linux-gnu/dist
          chmod +x "$HOME/.cargo/bin/dist"
          dist --version

      - name: Plan portable artifacts
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          dist plan --tag='${{ steps.release.outputs.tag }}' --output-format=json > plan-dist-manifest.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("plan-dist-manifest.json")
          manifest = json.loads(path.read_text(encoding="utf-8"))
          matrix = manifest["ci"]["github"]["artifacts_matrix"]["include"]
          for job in matrix:
              container = job.get("container")
              if container:
                  if container.get("image") != "messense/cargo-xwin":
                      raise SystemExit(f"unexpected release container: {container!r}")
                  container["image"] = "messense/cargo-xwin@sha256:62351ad39ca7f3bd60e8e6e186d8fd35732876dda6bef93d64ee368234a3c75c"
              packages = job.get("packages_install", "")
              packages = packages.replace("pip3 install --upgrade pip\n", "")
              packages = packages.replace("pip3 install cargo-xwin", "pip3 install cargo-xwin==0.22.0")
              job["packages_install"] = packages
          path.write_text(json.dumps(manifest, separators=(",", ":")), encoding="utf-8")
          PY
          jq . plan-dist-manifest.json
          echo "manifest=$(jq -c . plan-dist-manifest.json)" >> "$GITHUB_OUTPUT"

      - name: Preserve the build plan for diagnostics
        uses: actions/upload-artifact@v6
        with:
          name: internal-plan-dist-manifest
          path: plan-dist-manifest.json
          retention-days: 7

  build-portable-artifacts:
    name: portable (${{ join(matrix.targets, ', ') }})
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.manifest).ci.github.artifacts_matrix }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container && matrix.container.image || null }}
    steps:
      - name: Enable Windows long paths
        run: git config --global core.longpaths true

      - name: Checkout exact release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.plan.outputs.commit }}
          persist-credentials: false

      - name: Install Rust in build container
        if: ${{ matrix.container }}
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v cargo >/dev/null 2>&1; then
            echo "pinned cargo-xwin container is missing cargo" >&2
            exit 1
          fi

      - name: Install checksum-pinned cargo-dist (Unix)
        if: ${{ runner.os != 'Windows' }}
        shell: bash
        env:
          HOST: ${{ matrix.host }}
        run: |
          set -euo pipefail
          case "$HOST" in
            aarch64-apple-darwin) expected=decb01c64c12501931c3cac3111b368a7f48adf8d9e65455c08e5757b9a1fd6f ;;
            x86_64-apple-darwin) expected=fd4d8f9f07802359cbcdc52bac3abd7d5201c4b73a7cbcdd6faca2232a389f0c ;;
            aarch64-unknown-linux-gnu) expected=382cc29ff91ef12a5bf78ad8ee1804661d24e2fbe64b1bdedd6078723b677ae5 ;;
            x86_64-unknown-linux-gnu) expected=cd355dab0b4c02fb59038fef87655550021d07f45f1d82f947a34ef98560abb8 ;;
            x86_64-unknown-linux-musl) expected=1d46b93a785e8b666c0e7add581d747d53c3f29589cc3ef9aee60341ad899023 ;;
            *) echo "unsupported cargo-dist host: $HOST" >&2; exit 1 ;;
          esac
          archive="$(mktemp)"
          trap 'rm -f "$archive"' EXIT
          curl --proto '=https' --tlsv1.2 -fL --retry 6 --retry-all-errors --retry-delay 5 \
            "https://github.com/axodotdev/cargo-dist/releases/download/v0.31.0/cargo-dist-$HOST.tar.xz" \
            -o "$archive"
          if command -v sha256sum >/dev/null 2>&1; then
            echo "$expected  $archive" | sha256sum -c -
          else
            echo "$expected  $archive" | shasum -a 256 -c -
          fi
          mkdir -p "$HOME/.cargo/bin"
          tar -xJf "$archive" -C "$HOME/.cargo/bin" --strip-components=1 "cargo-dist-$HOST/dist"
          chmod +x "$HOME/.cargo/bin/dist"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install checksum-pinned cargo-dist (Windows)
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'cargo-dist.zip'
          Invoke-WebRequest -UseBasicParsing 'https://github.com/axodotdev/cargo-dist/releases/download/v0.31.0/cargo-dist-x86_64-pc-windows-msvc.zip' -OutFile $archive
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne 'a14e17557b269b101405e0cc6b647581d56313c954a51c7fddd423bba21e17b2') {
            throw "cargo-dist archive hash mismatch: $actual"
          }
          $destination = Join-Path $env:USERPROFILE '.cargo\bin'
          New-Item -ItemType Directory -Force -Path $destination | Out-Null
          Expand-Archive -LiteralPath $archive -DestinationPath $env:RUNNER_TEMP -Force
          Copy-Item -LiteralPath (Join-Path $env:RUNNER_TEMP 'dist.exe') -Destination (Join-Path $destination 'dist.exe') -Force
          $destination | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Linux audio and compositor qualification packages
        if: ${{ runner.os == 'Linux' && contains(join(matrix.targets, ','), '-unknown-linux-') }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            grim imagemagick libasound2-dev openbox python3 sway x11-utils \
            x11-xserver-utils xcompmgr xvfb

      - name: Install native packages
        run: |
          ${{ matrix.packages_install }}

      - name: Build exact-tag portable artifacts
        shell: bash
        run: |
          set -euo pipefail
          dist build --tag='${{ needs.plan.outputs.tag }}' --print=linkage --output-format=json ${{ matrix.dist_args }} > dist-manifest.json

      - name: Qualify exact Linux archive payload before upload
        if: ${{ runner.os == 'Linux' && contains(join(matrix.targets, ','), '-unknown-linux-') }}
        shell: bash
        run: |
          set -euo pipefail
          target='${{ join(matrix.targets, '') }}'
          case "$target" in
            x86_64-unknown-linux-gnu|x86_64-unknown-linux-musl) machine=62 ;;
            aarch64-unknown-linux-gnu|aarch64-unknown-linux-musl) machine=183 ;;
            *) echo "unexpected Linux portable target: $target" >&2; exit 1 ;;
          esac
          archive="target/distrib/honk300-$target.tar.xz"
          root="honk300-$target"
          binary="target/exact-linux-$target/$root/honk300"
          evidence="target/linux-portable-qualification-$target"
          test -f "$archive" && test ! -L "$archive"
          rm -rf "target/exact-linux-$target" "$evidence"
          mkdir -p "target/exact-linux-$target" "$evidence"
          tar -tJf "$archive" | LC_ALL=C sort > "$evidence/archive-members.txt"
          test "$(grep -Fxc "$root/honk300" "$evidence/archive-members.txt")" -eq 1
          tar -xJf "$archive" -C "target/exact-linux-$target"
          test -x "$binary" && test ! -L "$binary"
          python3 script/verify_binary_architecture.py --format elf --machine "$machine" "$binary" \
            | tee "$evidence/architecture.txt"
          archive_before="$(sha256sum "$archive" | awk '{print $1}')"
          binary_before="$(sha256sum "$binary" | awk '{print $1}')"
          {
            echo "target=$target"
            echo "elf_machine=$machine"
            echo "archive_sha256_before=$archive_before"
            echo "binary_sha256_before=$binary_before"
          } > "$evidence/identity.txt"
          HONK300_BIN="$PWD/$binary" \
          HONK300_EVIDENCE_DIR="$PWD/$evidence/compositor" \
            sh script/smoke_m17_m18_linux.sh
          archive_after="$(sha256sum "$archive" | awk '{print $1}')"
          binary_after="$(sha256sum "$binary" | awk '{print $1}')"
          test "$archive_after" = "$archive_before"
          test "$binary_after" = "$binary_before"
          {
            echo "archive_sha256_after=$archive_after"
            echo "binary_sha256_after=$binary_after"
          } >> "$evidence/identity.txt"

      - name: Upload exact Linux portable qualification evidence
        if: ${{ always() && runner.os == 'Linux' && contains(join(matrix.targets, ','), '-unknown-linux-') }}
        uses: actions/upload-artifact@v6
        with:
          name: qualification-linux-portable-${{ join(matrix.targets, '_') }}
          path: target/linux-portable-qualification-${{ join(matrix.targets, '') }}
          if-no-files-found: error
          retention-days: 7

      - name: Collect upload paths
        id: cargo-dist
        shell: bash
        run: |
          {
            echo "paths<<EOF"
            dist print-upload-files-from-manifest --manifest dist-manifest.json
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Upload portable artifacts to the orchestrator
        uses: actions/upload-artifact@v6
        with:
          name: release-portable-${{ join(matrix.targets, '_') }}
          path: ${{ steps.cargo-dist.outputs.paths }}
          if-no-files-found: error
          retention-days: 7

  build-debian-packages:
    name: Debian package producer
    needs:
      - plan
      - build-portable-artifacts
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.plan.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download exact qualified GNU archives
        uses: actions/download-artifact@v7
        with:
          pattern: release-portable-*-unknown-linux-gnu
          path: target/debian-portable-input

      - name: Build stable packages from the exact qualified binaries
        env:
          TAG: ${{ needs.plan.outputs.tag }}
          COMMIT: ${{ needs.plan.outputs.commit }}
        shell: bash
        run: |
          set -euo pipefail
          version="${TAG#v}"
          source_date_epoch="$(git show -s --format=%ct "$COMMIT")"
          packages="target/debian-packages"
          evidence="target/debian-package-build-evidence"
          mkdir -p "$packages" "$evidence"
          while read -r target architecture machine; do
            mapfile -t archives < <(find target/debian-portable-input -type f \
              -name "honk300-$target.tar.xz" -print)
            test "${#archives[@]}" -eq 1
            archive="${archives[0]}"
            extraction="target/debian-input-$architecture"
            case "$architecture" in
              amd64) output="$packages/honk300-amd64.deb" ;;
              arm64) output="$packages/honk300-arm64.deb" ;;
              *) echo "unsupported Debian architecture: $architecture" >&2; exit 1 ;;
            esac
            rm -rf "$extraction"
            mkdir -p "$extraction" "$evidence/$architecture"
            tar -xJf "$archive" -C "$extraction"
            mapfile -t binaries < <(find "$extraction" -type f -name honk300 -print)
            test "${#binaries[@]}" -eq 1
            binary="${binaries[0]}"
            python3 script/package_deb.py \
              --binary "$binary" \
              --output "$output" \
              --version "$version" \
              --tag "$TAG" \
              --commit "$COMMIT" \
              --architecture "$architecture" \
              --source-date-epoch "$source_date_epoch"
            dpkg-deb --info "$output" > "$evidence/$architecture/info.txt"
            dpkg-deb --contents "$output" > "$evidence/$architecture/contents.txt"
            extracted="$evidence/$architecture/root"
            dpkg-deb --extract "$output" "$extracted"
            cmp "$binary" "$extracted/usr/lib/honk300/honk300"
            test "$(readlink "$extracted/usr/bin/honk300")" = '../lib/honk300/honk300'
            test "$(readlink "$extracted/usr/bin/honk")" = '../lib/honk300/honk300'
            test "$(readlink "$extracted/usr/bin/goose")" = '../lib/honk300/honk300'
            test "$(cat "$extracted/usr/lib/honk300/install-source.txt")" = deb
            test "$(dpkg-deb --field "$output" Package)" = honk300
            test "$(dpkg-deb --field "$output" Version)" = "$version"
            test "$(dpkg-deb --field "$output" Architecture)" = "$architecture"
            python3 script/verify_binary_architecture.py \
              --format elf --machine "$machine" "$extracted/usr/lib/honk300/honk300" \
              > "$evidence/$architecture/architecture.txt"
            sha256sum "$archive" "$binary" "$extracted/usr/lib/honk300/honk300" "$output" \
              > "$evidence/$architecture/sha256.txt"
          done <<'DEBIAN_TARGETS'
          x86_64-unknown-linux-gnu amd64 62
          aarch64-unknown-linux-gnu arm64 183
          DEBIAN_TARGETS

      - name: Upload Debian release packages
        uses: actions/upload-artifact@v6
        with:
          name: release-debian-packages
          path: target/debian-packages/*.deb
          if-no-files-found: error
          retention-days: 7

      - name: Preserve Debian build identity evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: qualification-debian-package-build
          path: target/debian-package-build-evidence
          if-no-files-found: error
          retention-days: 7

  qualify-debian-packages:
    name: native Debian package (${{ matrix.architecture }})
    needs:
      - plan
      - build-debian-packages
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            architecture: amd64
          - runner: ubuntu-22.04-arm
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.plan.outputs.commit }}
          persist-credentials: false

      - name: Download exact Debian packages
        uses: actions/download-artifact@v7
        with:
          name: release-debian-packages
          path: target/debian-package-input

      - name: Install compositor qualification prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            grim imagemagick libasound2-dev openbox python3 sway x11-utils \
            x11-xserver-utils xcompmgr xvfb

      - name: Prove native package, aliases, compositor, updates, uninstall, and purge
        env:
          HONK300_DEB_PACKAGE: ${{ github.workspace }}/target/debian-package-input/honk300-${{ matrix.architecture }}.deb
          HONK300_DEB_EVIDENCE_DIR: ${{ github.workspace }}/target/debian-package-qualification-${{ matrix.architecture }}
          HONK300_DEB_SKIP_LATEST: '1'
          TAG: ${{ needs.plan.outputs.tag }}
        shell: bash
        run: sh script/smoke_released_deb.sh "$TAG"

      - name: Preserve native Debian package evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: qualification-debian-package-${{ matrix.architecture }}
          path: target/debian-package-qualification-${{ matrix.architecture }}
          if-no-files-found: error
          retention-days: 7

  qualify-windows-portable:
    name: exact portable ZIP (${{ matrix.triple }})
    needs:
      - plan
      - build-portable-artifacts
    strategy:
      fail-fast: false
      matrix:
        include:
          - triple: x86_64-pc-windows-msvc
            runner: windows-2022
            machine: '0x8664'
            host_arch: AMD64
          - triple: aarch64-pc-windows-msvc
            runner: windows-11-arm
            machine: '0xAA64'
            host_arch: ARM64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.plan.outputs.commit }}
          persist-credentials: false

      - name: Download exact cargo-dist ZIP payload
        uses: actions/download-artifact@v7
        with:
          name: release-portable-${{ matrix.triple }}
          path: target/windows-portable-input

      - name: Prove host, PE identity, ZIP shape, hashes, compositor, and lifecycle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:PROCESSOR_ARCHITECTURE -ne '${{ matrix.host_arch }}') {
            throw "Expected ${{ matrix.host_arch }} host, got '$env:PROCESSOR_ARCHITECTURE'"
          }
          $zip = 'target/windows-portable-input/honk300-${{ matrix.triple }}.zip'
          if (-not (Test-Path -LiteralPath $zip -PathType Leaf)) {
            throw "Exact cargo-dist ZIP is missing: $zip"
          }
          $extract = 'target/windows-portable-extracted-${{ matrix.triple }}'
          $evidence = 'target/windows-portable-qualification-${{ matrix.triple }}'
          Remove-Item -LiteralPath $extract, $evidence -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $extract, $evidence | Out-Null
          Expand-Archive -LiteralPath $zip -DestinationPath $extract
          $binary = Join-Path $extract 'honk300.exe'
          if (-not (Test-Path -LiteralPath $binary -PathType Leaf)) {
            throw "cargo-dist ZIP must contain root honk300.exe"
          }
          $unexpected = Get-ChildItem -LiteralPath $extract -Recurse -Filter honk300.exe |
            Where-Object { $_.FullName -ne (Resolve-Path -LiteralPath $binary).Path }
          if ($unexpected) { throw 'cargo-dist ZIP contains duplicate honk300.exe payloads' }
          python script/verify_binary_architecture.py --format pe --machine '${{ matrix.machine }}' $binary |
            Tee-Object -FilePath (Join-Path $evidence 'architecture.txt')
          if ($LASTEXITCODE -ne 0) { throw 'cargo-dist PE identity check failed' }
          $zipBefore = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $binaryBefore = (Get-FileHash -LiteralPath $binary -Algorithm SHA256).Hash.ToLowerInvariant()
          @(
            "triple=${{ matrix.triple }}",
            "pe_machine=${{ matrix.machine }}",
            "zip_sha256_before=$zipBefore",
            "binary_sha256_before=$binaryBefore"
          ) | Set-Content -LiteralPath (Join-Path $evidence 'identity.txt') -Encoding utf8
          ./script/smoke_windows_overlay.ps1 `
            -Binary $binary `
            -EvidenceDirectory (Join-Path $evidence 'compositor')
          $zipAfter = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $binaryAfter = (Get-FileHash -LiteralPath $binary -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($zipAfter -ne $zipBefore) { throw 'cargo-dist ZIP changed during qualification' }
          if ($binaryAfter -ne $binaryBefore) { throw 'extracted binary changed during qualification' }
          @(
            "zip_sha256_after=$zipAfter",
            "binary_sha256_after=$binaryAfter"
          ) | Add-Content -LiteralPath (Join-Path $evidence 'identity.txt') -Encoding utf8

      - name: Upload exact Windows portable qualification evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: qualification-windows-portable-${{ matrix.triple }}
          path: target/windows-portable-qualification-${{ matrix.triple }}
          if-no-files-found: error
          retention-days: 7

  windows-installers:
    needs: plan
    uses: ./.github/workflows/windows-installers.yml
    with:
      tag: ${{ needs.plan.outputs.tag }}
      commit: ${{ needs.plan.outputs.commit }}
      candidate: ${{ inputs.candidate || false }}

  macos-app:
    needs: plan
    uses: ./.github/workflows/macos-packaging.yml
    with:
      tag: ${{ needs.plan.outputs.tag }}
      commit: ${{ needs.plan.outputs.commit }}
      candidate: ${{ inputs.candidate || false }}
    secrets:
      MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
      APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
      APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
      APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}

  assemble-and-publish:
    name: Verify, upload once, and publish latest
    needs:
      - plan
      - build-portable-artifacts
      - build-debian-packages
      - qualify-debian-packages
      - qualify-windows-portable
      - windows-installers
      - macos-app
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.plan.outputs.tag }}
      COMMIT: ${{ needs.plan.outputs.commit }}
    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.plan.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download every producer artifact
        uses: actions/download-artifact@v7
        with:
          pattern: release-*
          path: incoming

      - name: Flatten artifacts and reject duplicate filenames
        shell: bash
        run: |
          set -euo pipefail
          mkdir release-assets
          declare -A seen=()
          while IFS= read -r -d '' source; do
            name="$(basename "$source")"
            case "$name" in
              *.sha256|sha256.sum|dist-manifest.json|*-dist-manifest.json) continue ;;
            esac
            if [ -n "${seen[$name]:-}" ]; then
              echo "duplicate release artifact name: $name" >&2
              exit 1
            fi
            seen[$name]="$source"
            cp "$source" "release-assets/$name"
          done < <(find incoming -type f -print0)
          find release-assets -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Render immutable project-owned installers
        shell: bash
        run: |
          set -euo pipefail
          python3 script/release_metadata.py render-installers \
            --directory release-assets \
            --tag "$TAG" \
            --commit "$COMMIT"
          sh -n release-assets/honk300-installer.sh
          # PowerShell, not Bash, expands these variables.
          # shellcheck disable=SC2016
          pwsh -NoProfile -Command '$tokens=$null; $errors=$null; [void][System.Management.Automation.Language.Parser]::ParseFile("release-assets/honk300-installer.ps1", [ref]$tokens, [ref]$errors); if ($errors.Count) { $errors | Out-String | Write-Error; exit 1 }'

      - name: Validate exact compatibility and primary artifact set
        shell: bash
        run: python3 script/release_metadata.py validate --directory release-assets

      - name: Generate stable public manifest and checksums
        shell: bash
        run: |
          set -euo pipefail
          # The stable manifest names only sidecars that already exist and match their payload.
          python3 script/release_metadata.py sidecars --directory release-assets
          python3 script/release_metadata.py manifest \
            --directory release-assets \
            --tag "$TAG" \
            --commit "$COMMIT" \
            --output release-assets/release-manifest.json
          (
            cd release-assets
            find . -maxdepth 1 -type f ! -name '*.sha256' ! -name 'sha256.sum' -printf '%f\n' \
              | LC_ALL=C sort \
              | while IFS= read -r file; do sha256sum "$file"; done \
              > sha256.sum
          )
          # Add the manifest's own sidecar after its bytes are sealed. Payload sidecars are
          # deterministically rewritten with the same verified content.
          python3 script/release_metadata.py sidecars --directory release-assets

      - name: Verify every local checksum and manifest hash
        shell: bash
        run: |
          set -euo pipefail
          (
            cd release-assets
            sha256sum -c sha256.sum
            for sidecar in *.sha256; do sha256sum -c "$sidecar"; done
          )
          python3 - <<'PY'
          import hashlib, json, pathlib
          root = pathlib.Path('release-assets')
          manifest = json.loads((root / 'release-manifest.json').read_text(encoding='utf-8'))
          assert manifest['schema'] == 'honk300.release.v1'
          assert manifest['tag'] == '${{ needs.plan.outputs.tag }}'
          assert manifest['commit'] == '${{ needs.plan.outputs.commit }}'
          for artifact in manifest['artifacts']:
              path = root / artifact['name']
              checksum = root / artifact['checksum']
              assert path.is_file() and not path.is_symlink()
              assert checksum.is_file() and not checksum.is_symlink()
              assert artifact['checksum'] == artifact['name'] + '.sha256'
              assert path.stat().st_size == artifact['size']
              assert hashlib.sha256(path.read_bytes()).hexdigest() == artifact['sha256']
              assert checksum.read_text(encoding='utf-8') == artifact['sha256'] + ' *' + artifact['name'] + '\n'
          PY

      - name: Smoke shell installer twice without sudo
        shell: bash
        run: |
          set -euo pipefail
          smoke="$(mktemp -d)"
          mkdir -p "$smoke/home"
          for _ in 1 2; do
            HOME="$smoke/home" \
            XDG_DATA_HOME="$smoke/data" \
            XDG_CONFIG_HOME="$smoke/config" \
            HONK300_TEST_LOCAL_DIR="$PWD/release-assets" \
              sh release-assets/honk300-installer.sh
          done
          binary="$smoke/data/honk300/install/bin/honk300"
          test -x "$binary"
          test "$("$binary" --version | awk '{print $NF}' | sed 's/[+-].*$//')" = "${TAG#v}"
          test "$(readlink "$smoke/home/.local/bin/honk300")" = "$binary"
          python3 -m json.tool "$smoke/data/honk300/install-receipt.json" >/dev/null
          before="$(sha256sum "$binary" | awk '{print $1}')"
          set +e
          HOME="$smoke/home" \
          XDG_DATA_HOME="$smoke/data" \
          XDG_CONFIG_HOME="$smoke/config" \
          HONK300_TEST_LOCAL_DIR="$PWD/release-assets" \
          HONK300_TEST_FAIL_AFTER_SWAP=1 \
            sh release-assets/honk300-installer.sh
          fault_status=$?
          set -e
          test "$fault_status" -ne 0
          test "$(sha256sum "$binary" | awk '{print $1}')" = "$before"
          test "$("$binary" --version | awk '{print $NF}' | sed 's/[+-].*$//')" = "${TAG#v}"

      - name: Candidate artifact set verified without publication
        if: ${{ inputs.candidate }}
        shell: bash
        run: echo "Candidate artifact set verified without publication for $TAG at $COMMIT"

      - name: Preserve the complete verified candidate artifact set
        if: ${{ inputs.candidate }}
        uses: actions/upload-artifact@v6
        with:
          name: candidate-release-assets-${{ needs.plan.outputs.tag }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

      - name: Refuse mutable or pre-existing release state
        if: ${{ !inputs.candidate }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          test "$(git rev-parse "$TAG^{commit}")" = "$COMMIT"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $TAG already exists; published releases are immutable, use a new patch version" >&2
            exit 1
          fi

      - name: Create unpublished draft
        if: ${{ !inputs.candidate }}
        id: create_draft
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --target "$COMMIT" \
            --draft \
            --latest=false \
            --title "honk300 ${TAG#v}" \
            --generate-notes

      - name: Upload complete asset set once
        if: ${{ !inputs.candidate }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$TAG" release-assets/* --repo "$GITHUB_REPOSITORY"

      - name: Verify remote asset set and bytes
        if: ${{ !inputs.candidate }}
        shell: bash
        run: |
          set -euo pipefail
          find release-assets -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort > local-assets.txt
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' \
            | LC_ALL=C sort > remote-assets.txt
          diff -u local-assets.txt remote-assets.txt
          mkdir remote-assets
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir remote-assets
          while IFS= read -r name; do cmp "release-assets/$name" "remote-assets/$name"; done < local-assets.txt

      - name: Publish stable latest release
        if: ${{ !inputs.candidate }}
        id: publish
        shell: bash
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft=false --latest

      - name: Delete this run's unpublished draft after failure
        if: ${{ failure() && steps.create_draft.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true ]; then
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes
          else
            echo "Release is already published; immutable release state was preserved."
          fi
