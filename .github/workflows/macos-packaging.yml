name: macOS Packaging

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      commit:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Immutable stable release tag, for example v0.3.0"
        required: true
        type: string
      commit:
        description: "Full 40-character commit SHA named by the tag"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-macos-app:
    name: universal2 app and compatibility DMG
    runs-on: macos-15
    steps:
      - name: Validate immutable release identity
        id: release
        shell: bash
        run: |
          set -euo pipefail
          tag='${{ inputs.tag }}'
          commit='${{ inputs.commit }}'
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "unstable tag: $tag" >&2; exit 1; }
          [[ "$commit" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "invalid commit: $commit" >&2; exit 1; }
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Checkout exact release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove tag and checkout identify the same commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          test "$(git rev-parse HEAD)" = '${{ inputs.commit }}'
          test "$(git rev-parse '${{ inputs.tag }}^{commit}')" = "$(git rev-parse HEAD)"

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.95.0
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Stage and seal universal2 Honk300.app
        env:
          HONK300_VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          bash script/package_macos_app.sh
          app="target/dist/macos-universal2/Honk300.app"
          test -d "$app"
          lipo "$app/Contents/MacOS/honk300" -verify_arch x86_64 arm64
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist")" = 'dev.emmetts.honk300'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")" = '${{ steps.release.outputs.version }}'
          codesign --verify --deep --strict --verbose=2 "$app"

      - name: Package sealed app and compatibility DMG
        shell: bash
        run: |
          set -euo pipefail
          app="target/dist/macos-universal2/Honk300.app"
          output="target/release-artifacts"
          stage="$RUNNER_TEMP/dmg-stage"
          mkdir -p "$output" "$stage"
          ditto -c -k --sequesterRsrc --keepParent "$app" "$output/honk300-universal2.app.zip"
          ditto "$app" "$stage/Honk300.app"
          ln -s /Applications "$stage/Applications"
          hdiutil create \
            -volname "Honk300" \
            -srcfolder "$stage" \
            -fs HFS+ \
            -format UDZO \
            -ov \
            "$output/honk300-universal2.dmg"
          codesign --verify --deep --strict --verbose=2 "$app"
          unzip -t "$output/honk300-universal2.app.zip"
          test -f "$output/honk300-universal2.dmg"

      - name: Upload platform artifacts to the release orchestrator
        uses: actions/upload-artifact@v6
        with:
          name: release-macos-universal2
          path: target/release-artifacts/*
          if-no-files-found: error
          retention-days: 7
