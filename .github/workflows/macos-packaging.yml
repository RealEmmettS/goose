name: macOS Packaging

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      commit:
        required: true
        type: string
      candidate:
        required: false
        default: false
        type: boolean
    secrets:
      MACOS_CERTIFICATE_P12_BASE64:
        required: true
      MACOS_CERTIFICATE_PASSWORD:
        required: true
      MACOS_KEYCHAIN_PASSWORD:
        required: true
      APPLE_NOTARY_KEY_P8_BASE64:
        required: true
      APPLE_NOTARY_KEY_ID:
        required: true
      APPLE_NOTARY_ISSUER_ID:
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: "Immutable stable release tag, for example v0.3.3"
        required: true
        type: string
      commit:
        description: "Full 40-character commit SHA named by the tag"
        required: true
        type: string
      candidate:
        description: "Build and verify before the tag exists"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  build-macos-app:
    name: signed, notarized universal2 app and DMG
    runs-on: macos-15
    steps:
      - name: Validate immutable release identity
        id: release
        shell: bash
        run: |
          set -euo pipefail
          tag='${{ inputs.tag }}'
          commit='${{ inputs.commit }}'
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "unstable tag: $tag" >&2; exit 1; }
          [[ "$commit" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "invalid commit: $commit" >&2; exit 1; }
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Checkout exact release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove tag and checkout identify the same commit
        shell: bash
        env:
          CANDIDATE: ${{ inputs.candidate }}
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          test "$(git rev-parse HEAD)" = '${{ inputs.commit }}'
          if [ "$CANDIDATE" = true ]; then
            if git show-ref --verify --quiet 'refs/tags/${{ inputs.tag }}'; then
              echo "candidate tag already exists; use release mode or a new patch version" >&2
              exit 1
            fi
          else
            test "$(git rev-parse '${{ inputs.tag }}^{commit}')" = "$(git rev-parse HEAD)"
          fi

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.95.0
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Install both Apple architecture targets
        shell: bash
        run: rustup target add x86_64-apple-darwin aarch64-apple-darwin

      - name: Fail closed unless every signing and notarization credential is present
        shell: bash
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
          APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          for name in \
            MACOS_CERTIFICATE_P12_BASE64 \
            MACOS_CERTIFICATE_PASSWORD \
            MACOS_KEYCHAIN_PASSWORD \
            APPLE_NOTARY_KEY_P8_BASE64 \
            APPLE_NOTARY_KEY_ID \
            APPLE_NOTARY_ISSUER_ID
          do
            test -n "${!name:-}" || { echo "required release credential is unavailable: $name" >&2; exit 1; }
          done

      - name: Import Developer ID identity into an ephemeral keychain
        id: signing
        shell: bash
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
          APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/honk300-signing.keychain-db"
          certificate="$RUNNER_TEMP/honk300-developer-id.p12"
          notary_key="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$MACOS_CERTIFICATE_P12_BASE64" | base64 -D > "$certificate"
          printf '%s' "$APPLE_NOTARY_KEY_P8_BASE64" | base64 -D > "$notary_key"
          chmod 600 "$certificate" "$notary_key"
          security create-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$keychain"
          security import "$certificate" \
            -k "$keychain" \
            -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$MACOS_KEYCHAIN_PASSWORD" \
            "$keychain"
          login_keychain="$(security default-keychain -d user | tr -d '"')"
          security list-keychains -d user -s "$keychain" "$login_keychain"
          identity="$(security find-identity -v -p codesigning "$keychain" \
            | awk -F'"' '/Developer ID Application:.*\(M9D5379H93\)/ { print $2; exit }')"
          test -n "$identity" || { echo 'team M9D5379H93 Developer ID identity is unavailable' >&2; exit 1; }
          count="$(security find-identity -v -p codesigning "$keychain" \
            | grep -c 'Developer ID Application:.*(M9D5379H93)' || true)"
          test "$count" -eq 1 || { echo "expected one team Developer ID identity, found $count" >&2; exit 1; }
          {
            echo "identity=$identity"
            echo "keychain=$keychain"
            echo "certificate=$certificate"
            echo "notary_key=$notary_key"
          } >> "$GITHUB_OUTPUT"

      - name: Build and seal the universal app and graphical installer inside-out
        env:
          HONK300_VERSION: ${{ steps.release.outputs.version }}
          HONK300_TAG: ${{ inputs.tag }}
          HONK300_COMMIT: ${{ inputs.commit }}
          MACOS_SIGN_IDENTITY: ${{ steps.signing.outputs.identity }}
        shell: bash
        run: |
          set -euo pipefail
          verify_developer_id() {
            target="$1"
            expected_identifier="$2"
            details="$(codesign -dv --verbose=4 "$target" 2>&1)"
            printf '%s\n' "$details" | grep -F 'Authority=Developer ID Application: ES Development LLC (M9D5379H93)'
            printf '%s\n' "$details" | grep -F 'TeamIdentifier=M9D5379H93'
            printf '%s\n' "$details" | grep -F 'flags=0x10000(runtime)'
            printf '%s\n' "$details" | grep -E '^Timestamp='
            requirement="$(codesign -d -r- "$target" 2>&1)"
            printf '%s\n' "$requirement" | grep -F "identifier \"$expected_identifier\""
            printf '%s\n' "$requirement" | grep -F 'anchor apple generic'
            printf '%s\n' "$requirement" | grep -F 'certificate leaf[subject.OU] = M9D5379H93'
          }
          bash script/package_macos_app.sh
          bash script/package_macos_installer_helper.sh
          app="target/dist/macos-universal2/Honk300.app"
          helper="target/dist/macos-universal2/Install Honk300.app"
          app_bin="$app/Contents/MacOS/honk300"
          helper_bin="$helper/Contents/MacOS/Install Honk300"
          test -d "$app" && test -d "$helper"
          lipo "$app_bin" -verify_arch x86_64 arm64
          lipo "$helper_bin" -verify_arch x86_64 arm64
          xcrun vtool -show-build "$helper_bin" > "$RUNNER_TEMP/helper-deployment.txt"
          test "$(grep -c 'minos 11.0' "$RUNNER_TEMP/helper-deployment.txt")" -eq 2
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist")" = 'dev.emmetts.honk300'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")" = '${{ steps.release.outputs.version }}'
          test "$(/usr/libexec/PlistBuddy -c 'Print :Honk300ReleaseTag' "$app/Contents/Info.plist")" = '${{ inputs.tag }}'
          test "$(/usr/libexec/PlistBuddy -c 'Print :Honk300ReleaseCommit' "$app/Contents/Info.plist")" = '${{ inputs.commit }}'
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$helper/Contents/Info.plist")" = '11.0'
          codesign --verify --strict --verbose=4 "$app_bin"
          codesign --verify --strict --verbose=4 "$app"
          codesign --verify --strict --verbose=4 "$helper_bin"
          codesign --verify --strict --verbose=4 "$helper"
          verify_developer_id "$app" dev.emmetts.honk300
          verify_developer_id "$app_bin" dev.emmetts.honk300
          verify_developer_id "$helper" dev.emmetts.honk300.installer
          verify_developer_id "$helper_bin" dev.emmetts.honk300.installer

      - name: Notarize, staple, and seal the final app ZIP
        shell: bash
        env:
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          NOTARY_KEY: ${{ steps.signing.outputs.notary_key }}
        run: |
          set -euo pipefail
          app="target/dist/macos-universal2/Honk300.app"
          output="target/release-artifacts"
          evidence="target/notarization-evidence"
          submission="$RUNNER_TEMP/honk300-app-submission.zip"
          mkdir -p "$output" "$evidence"
          ditto -c -k --sequesterRsrc --keepParent "$app" "$submission"
          xcrun notarytool submit "$submission" \
            --key "$NOTARY_KEY" \
            --key-id "$APPLE_NOTARY_KEY_ID" \
            --issuer "$APPLE_NOTARY_ISSUER_ID" \
            --wait \
            --output-format json > "$evidence/app-submit.json"
          jq -e '.status == "Accepted" and (.id | length > 0)' "$evidence/app-submit.json"
          app_id="$(jq -r .id "$evidence/app-submit.json")"
          xcrun notarytool log "$app_id" \
            --key "$NOTARY_KEY" \
            --key-id "$APPLE_NOTARY_KEY_ID" \
            --issuer "$APPLE_NOTARY_ISSUER_ID" \
            "$evidence/app-log.json"
          rm -f "$submission"
          xcrun stapler staple "$app"
          xcrun stapler validate "$app"
          codesign --verify --strict --verbose=4 "$app"
          spctl --assess --type execute --verbose=4 "$app"
          ditto -c -k --sequesterRsrc --keepParent \
            "$app" "$output/honk300-universal2.app.zip"
          unzip -t "$output/honk300-universal2.app.zip"

      - name: Build, sign, notarize, staple, and validate the DMG
        shell: bash
        env:
          MACOS_SIGN_IDENTITY: ${{ steps.signing.outputs.identity }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          NOTARY_KEY: ${{ steps.signing.outputs.notary_key }}
        run: |
          set -euo pipefail
          app="target/dist/macos-universal2/Honk300.app"
          helper="target/dist/macos-universal2/Install Honk300.app"
          output="target/release-artifacts"
          evidence="target/notarization-evidence"
          stage="$RUNNER_TEMP/dmg-stage"
          mount="$RUNNER_TEMP/dmg-mount"
          dmg="$output/honk300-universal2.dmg"
          rm -rf "$stage" "$mount"
          mkdir -p "$stage"
          ditto "$app" "$stage/Honk300.app"
          ditto "$helper" "$stage/Install Honk300.app"
          ditto "packaging/macos/DMG-README.txt" "$stage/Read Me.txt"
          hdiutil create \
            -volname "Honk300" \
            -srcfolder "$stage" \
            -fs HFS+ \
            -format UDZO \
            -ov \
            "$dmg"
          mkdir -p "$mount"
          hdiutil attach -readonly -nobrowse -mountpoint "$mount" "$dmg"
          trap 'hdiutil detach "$mount" >/dev/null 2>&1 || true' EXIT
          test -d "$mount/Honk300.app"
          test -d "$mount/Install Honk300.app"
          test -f "$mount/Read Me.txt"
          test ! -e "$mount/Applications"
          test "$(find "$mount" -mindepth 1 -maxdepth 1 ! -name '.Trashes' | wc -l | tr -d ' ')" -eq 3
          hdiutil detach "$mount"
          trap - EXIT
          codesign --force --timestamp --sign "$MACOS_SIGN_IDENTITY" "$dmg"
          codesign --verify --strict --verbose=4 "$dmg"
          dmg_details="$(codesign -dv --verbose=4 "$dmg" 2>&1)"
          printf '%s\n' "$dmg_details" | grep -F 'Authority=Developer ID Application: ES Development LLC (M9D5379H93)'
          printf '%s\n' "$dmg_details" | grep -F 'TeamIdentifier=M9D5379H93'
          printf '%s\n' "$dmg_details" | grep -E '^Timestamp='
          xcrun notarytool submit "$dmg" \
            --key "$NOTARY_KEY" \
            --key-id "$APPLE_NOTARY_KEY_ID" \
            --issuer "$APPLE_NOTARY_ISSUER_ID" \
            --wait \
            --output-format json > "$evidence/dmg-submit.json"
          jq -e '.status == "Accepted" and (.id | length > 0)' "$evidence/dmg-submit.json"
          dmg_id="$(jq -r .id "$evidence/dmg-submit.json")"
          xcrun notarytool log "$dmg_id" \
            --key "$NOTARY_KEY" \
            --key-id "$APPLE_NOTARY_KEY_ID" \
            --issuer "$APPLE_NOTARY_ISSUER_ID" \
            "$evidence/dmg-log.json"
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
          codesign --verify --strict --verbose=4 "$dmg"
          spctl --assess --type open --context context:primary-signature --verbose=4 "$dmg"
          hdiutil attach -readonly -nobrowse -mountpoint "$mount" "$dmg"
          trap 'hdiutil detach "$mount" >/dev/null 2>&1 || true' EXIT
          codesign --verify --strict --verbose=4 "$mount/Honk300.app"
          codesign --verify --strict --verbose=4 "$mount/Install Honk300.app"
          spctl --assess --type execute --verbose=4 "$mount/Honk300.app"
          spctl --assess --type execute --verbose=4 "$mount/Install Honk300.app"
          hdiutil detach "$mount"
          trap - EXIT

      - name: Preserve notarization evidence for this workflow run
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: internal-macos-notarization-evidence
          path: target/notarization-evidence/*.json
          if-no-files-found: warn
          retention-days: 30

      - name: Upload platform artifacts to the release orchestrator
        uses: actions/upload-artifact@v6
        with:
          name: release-macos-universal2
          path: target/release-artifacts/*
          if-no-files-found: error
          retention-days: 7

      - name: Delete temporary signing credentials and keychain
        if: ${{ always() }}
        shell: bash
        env:
          KEYCHAIN: ${{ runner.temp }}/honk300-signing.keychain-db
          CERTIFICATE: ${{ runner.temp }}/honk300-developer-id.p12
          NOTARY_KEY: ${{ runner.temp }}/AuthKey.p8
        run: |
          set -euo pipefail
          rm -f "${CERTIFICATE:-}" "${NOTARY_KEY:-}"
          if [ -n "${KEYCHAIN:-}" ]; then
            security delete-keychain "$KEYCHAIN" || true
          fi
