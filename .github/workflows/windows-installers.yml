name: Windows Installers

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      commit:
        required: true
        type: string
      candidate:
        required: false
        default: false
        type: boolean
      same_sha_main:
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      tag:
        description: "Immutable stable release tag, for example v0.3.0"
        required: true
        type: string
      commit:
        description: "Full 40-character commit SHA named by the tag"
        required: true
        type: string
      candidate:
        description: "Build and verify before the tag exists"
        required: true
        default: true
        type: boolean
      same_sha_main:
        description: "Qualification-only main build may reuse the current Cargo version tag"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build-windows-installers:
    name: ${{ matrix.triple }} extra installers
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - triple: x86_64-pc-windows-msvc
            wix_arch: x64
            inno_arch: x64
            vcvars_arch: x64
          - triple: aarch64-pc-windows-msvc
            wix_arch: arm64
            inno_arch: arm64
            vcvars_arch: x64_arm64

    steps:
      - name: Enable Windows long paths
        shell: pwsh
        run: git config --global core.longpaths true

      - name: Resolve target tag
        id: tag
        shell: pwsh
        run: |
          $tag = "${{ inputs.tag }}"
          $commit = "${{ inputs.commit }}"
          if ($tag -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') {
            throw "Expected a stable vMAJOR.MINOR.PATCH tag, got '$tag'"
          }
          if ($commit -notmatch '^[0-9a-fA-F]{40}$') {
            throw "Expected a full commit SHA, got '$commit'"
          }
          $version = $tag -replace '^v', ''
          Add-Content -Path $env:GITHUB_OUTPUT -Value "tag=$tag"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$version"

      - name: Checkout exact release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove tag and checkout identify the same commit
        shell: pwsh
        env:
          CANDIDATE: ${{ inputs.candidate }}
          SAME_SHA_MAIN: ${{ inputs.same_sha_main }}
        run: |
          git fetch --force --tags origin
          $head = (git rev-parse HEAD).Trim()
          if ($head -ne "${{ inputs.commit }}") {
            throw "Requested commit and checkout do not match"
          }
          # A missing tag is normal in candidate mode. `git tag --list` keeps that probe at exit
          # zero under GitHub's fail-on-native-error PowerShell wrapper.
          $tagExists = [bool](git tag --list "${{ inputs.tag }}")
          if ($env:CANDIDATE -eq 'true') {
            if ($tagExists -and $env:SAME_SHA_MAIN -ne 'true') {
              throw "Candidate tag already exists; use release mode or a new patch version"
            }
          } else {
            if (-not $tagExists) { throw "Release tag does not exist" }
            $tagCommit = (git rev-parse "${{ inputs.tag }}^{commit}").Trim()
            if ($tagCommit -ne $head) {
              throw "Tag, requested commit, and checkout do not match"
            }
          }

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.95.0
          targets: ${{ matrix.triple }}

      - name: Install target for pinned toolchain
        shell: pwsh
        run: rustup target add ${{ matrix.triple }}

      - name: Ensure ARM64 MSVC build tools
        if: ${{ matrix.triple == 'aarch64-pc-windows-msvc' }}
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw "vswhere.exe not found at $vswhere" }

          $installPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installPath) { throw "Visual Studio C++ x64/x86 tools are not installed" }

          $arm64Path = & $vswhere -products * -requires Microsoft.VisualStudio.Component.VC.Tools.ARM64 -property installationPath
          if (-not $arm64Path) {
            $setup = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
            if (-not (Test-Path $setup)) { throw "Visual Studio setup.exe not found at $setup" }
            $args = @(
              "modify",
              "--installPath", $installPath,
              "--add", "Microsoft.VisualStudio.Component.VC.Tools.ARM64",
              "--quiet",
              "--norestart",
              "--nocache"
            )
            $proc = Start-Process -FilePath $setup -ArgumentList $args -Wait -PassThru
            if ($proc.ExitCode -ne 0 -and $proc.ExitCode -ne 3010) {
              throw "Visual Studio ARM64 tools install failed with exit $($proc.ExitCode)"
            }
          }

          $arm64Path = & $vswhere -products * -requires Microsoft.VisualStudio.Component.VC.Tools.ARM64 -property installationPath
          if (-not $arm64Path) { throw "Visual Studio ARM64 tools are still unavailable after install" }

      - name: Build honk300.exe
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installPath) { throw "Visual Studio C++ tools are not installed" }
          $vcvars = Join-Path $installPath "VC\Auxiliary\Build\vcvarsall.bat"
          if (-not (Test-Path $vcvars)) { throw "vcvarsall.bat not found at $vcvars" }
          $cmd = 'call "' + $vcvars + '" ${{ matrix.vcvars_arch }} && cargo build --release --locked --target ${{ matrix.triple }}'
          cmd.exe /c $cmd
          if ($LASTEXITCODE -ne 0) { throw "cargo build failed with exit $LASTEXITCODE" }

      - name: Prove exact build PE machine identity
        shell: pwsh
        run: |
          $machine = if ('${{ matrix.triple }}' -eq 'aarch64-pc-windows-msvc') { '0xAA64' } else { '0x8664' }
          python script/verify_binary_architecture.py `
            --format pe `
            --machine $machine `
            --subsystem 3 `
            target/${{ matrix.triple }}/release/honk300.exe
          python script/verify_binary_architecture.py `
            --format pe `
            --machine $machine `
            --subsystem 2 `
            target/${{ matrix.triple }}/release/honk300-app.exe
          if ($LASTEXITCODE -ne 0) { throw 'exact build PE identity check failed' }

      - name: Qualify immutable Windows slot activation with a live old process
        if: ${{ matrix.triple == 'x86_64-pc-windows-msvc' }}
        shell: pwsh
        run: >-
          ./script/smoke_windows_slot_update.ps1
          -Binary target/${{ matrix.triple }}/release/honk300.exe
          -TargetTriple ${{ matrix.triple }}
          -EvidenceDirectory target/windows-slot-update-evidence

      - name: Upload Windows slot update evidence
        if: ${{ always() && matrix.triple == 'x86_64-pc-windows-msvc' }}
        uses: actions/upload-artifact@v6
        with:
          name: qualification-windows-slot-update-${{ matrix.triple }}
          path: target/windows-slot-update-evidence
          if-no-files-found: error
          retention-days: 7

      - name: Qualify exact x64 layered overlay and lifecycle
        if: ${{ matrix.triple == 'x86_64-pc-windows-msvc' }}
        shell: pwsh
        run: >-
          ./script/smoke_windows_overlay.ps1
          -Binary target/${{ matrix.triple }}/release/honk300.exe
          -EvidenceDirectory target/windows-overlay-evidence
          -AllowUnobservableTrayRecoveryHost

      - name: Upload Windows overlay qualification evidence
        if: ${{ always() && matrix.triple == 'x86_64-pc-windows-msvc' }}
        uses: actions/upload-artifact@v6
        with:
          name: qualification-windows-overlay-${{ matrix.triple }}
          path: target/windows-overlay-evidence
          if-no-files-found: error
          retention-days: 7

      - name: Build Global and Corporate MSI
        shell: pwsh
        run: |
          $candle = "$env:WIX\bin\candle.exe"
          $light  = "$env:WIX\bin\light.exe"
          if (-not (Test-Path $candle)) { throw "candle.exe not found at $candle" }
          if (-not (Test-Path $light))  { throw "light.exe not found at $light" }
          $binDir = "target\${{ matrix.triple }}\release"
          $sourceRoot = (Get-Location).Path
          $payloadSha256 = (Get-FileHash -LiteralPath (Join-Path $binDir 'honk300.exe') -Algorithm SHA256).Hash.ToLowerInvariant()
          New-Item -ItemType Directory -Force -Path target\wix | Out-Null
          & $candle -arch ${{ matrix.wix_arch }} `
            "-dVersion=${{ steps.tag.outputs.version }}" `
            "-dTag=${{ inputs.tag }}" `
            "-dCommit=${{ inputs.commit }}" `
            "-dTargetTriple=${{ matrix.triple }}" `
            "-dPayloadSha256=$payloadSha256" `
            "-dCargoTargetBinDir=$binDir" `
            "-dSourceRoot=$sourceRoot" `
            -out target\wix\corporate.wixobj `
            wix-corporate\corporate.wxs
          if ($LASTEXITCODE -ne 0) { throw "corporate candle failed with exit $LASTEXITCODE" }
          & $candle -arch ${{ matrix.wix_arch }} `
            "-dVersion=${{ steps.tag.outputs.version }}" `
            "-dTag=${{ inputs.tag }}" `
            "-dCommit=${{ inputs.commit }}" `
            "-dTargetTriple=${{ matrix.triple }}" `
            "-dPayloadSha256=$payloadSha256" `
            "-dCargoTargetBinDir=$binDir" `
            "-dSourceRoot=$sourceRoot" `
            -out target\wix\global.wixobj `
            wix\main.wxs
          if ($LASTEXITCODE -ne 0) { throw "global candle failed with exit $LASTEXITCODE" }
          & $light -sice:ICE38 -sice:ICE64 -sice:ICE91 `
            -ext WixUIExtension `
            -out target\wix\honk300-${{ matrix.triple }}.msi `
            target\wix\global.wixobj
          if ($LASTEXITCODE -ne 0) { throw "global light failed with exit $LASTEXITCODE" }
          & $light -sice:ICE38 -sice:ICE64 -sice:ICE91 `
            -ext WixUIExtension `
            -out target\wix\honk300-${{ matrix.triple }}-corporate.msi `
            target\wix\corporate.wixobj
          if ($LASTEXITCODE -ne 0) { throw "light failed with exit $LASTEXITCODE" }

      - name: Prove Global MSI contains the exact PE build
        shell: pwsh
        run: |
          $source = (Resolve-Path 'target/${{ matrix.triple }}/release/honk300.exe').Path
          $launcherSource = (Resolve-Path 'target/${{ matrix.triple }}/release/honk300-app.exe').Path
          $msi = (Resolve-Path 'target/wix/honk300-${{ matrix.triple }}.msi').Path
          $stage = Join-Path $env:RUNNER_TEMP 'honk300-${{ matrix.triple }}-msi-identity'
          Remove-Item -LiteralPath $stage -Recurse -Force -ErrorAction SilentlyContinue
          $msiexec = Join-Path ([Environment]::GetFolderPath([Environment+SpecialFolder]::System)) 'msiexec.exe'
          $process = Start-Process $msiexec `
            -ArgumentList @('/a', "`"$msi`"", '/qn', '/norestart', "TARGETDIR=`"$stage`"") `
            -Wait -PassThru
          if ($process.ExitCode -notin @(0, 3010)) {
            throw "MSI administrative extraction failed with $($process.ExitCode)"
          }
          $payloads = @(Get-ChildItem -LiteralPath $stage -Recurse -Filter honk300.exe -File)
          if ($payloads.Count -ne 1) { throw "MSI expected one honk300.exe, got $($payloads.Count)" }
          $payload = $payloads[0].FullName
          $launchers = @(Get-ChildItem -LiteralPath $stage -Recurse -Filter honk300-app.exe -File)
          if ($launchers.Count -ne 1) { throw "MSI expected one honk300-app.exe, got $($launchers.Count)" }
          $launcher = $launchers[0].FullName
          $machine = if ('${{ matrix.triple }}' -eq 'aarch64-pc-windows-msvc') { '0xAA64' } else { '0x8664' }
          python script/verify_binary_architecture.py --format pe --machine $machine --subsystem 3 $payload
          python script/verify_binary_architecture.py --format pe --machine $machine --subsystem 2 $launcher
          if ($LASTEXITCODE -ne 0) { throw 'MSI payload PE identity check failed' }
          $sourceHash = (Get-FileHash -LiteralPath $source -Algorithm SHA256).Hash.ToLowerInvariant()
          $payloadHash = (Get-FileHash -LiteralPath $payload -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($payloadHash -ne $sourceHash) { throw 'MSI payload does not match exact qualified build' }
          $launcherSourceHash = (Get-FileHash -LiteralPath $launcherSource -Algorithm SHA256).Hash.ToLowerInvariant()
          $launcherHash = (Get-FileHash -LiteralPath $launcher -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($launcherHash -ne $launcherSourceHash) { throw 'MSI app launcher does not match exact qualified build' }
          $evidence = 'target/windows-msi-identity-${{ matrix.triple }}'
          New-Item -ItemType Directory -Force -Path $evidence | Out-Null
          @(
            'triple=${{ matrix.triple }}',
            "pe_machine=$machine",
            "source_sha256=$sourceHash",
            "msi_payload_sha256=$payloadHash",
            "launcher_sha256=$launcherHash"
          ) | Set-Content -LiteralPath (Join-Path $evidence 'identity.txt') -Encoding utf8

      - name: Upload MSI payload identity evidence
        uses: actions/upload-artifact@v6
        with:
          name: qualification-windows-msi-identity-${{ matrix.triple }}
          path: target/windows-msi-identity-${{ matrix.triple }}
          if-no-files-found: error
          retention-days: 7

      - name: Install Inno Setup 6
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress --no-color
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\iscc.exe")) {
            throw "Inno Setup install failed; iscc.exe missing"
          }

      - name: Build Global EXE installer
        shell: pwsh
        run: |
          $payloadSha256 = (Get-FileHash -LiteralPath 'target\${{ matrix.triple }}\release\honk300.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          & "C:\Program Files (x86)\Inno Setup 6\iscc.exe" `
            "/DMyAppVersion=${{ steps.tag.outputs.version }}" `
            "/DReleaseTag=${{ inputs.tag }}" `
            "/DReleaseCommit=${{ inputs.commit }}" `
            "/DPayloadSha256=$payloadSha256" `
            "/DTargetTriple=${{ matrix.triple }}" `
            "/DSourceBinDir=..\target\${{ matrix.triple }}\release" `
            "/DInnoArchitecturesAllowed=${{ matrix.inno_arch }}" `
            inno\global.iss
          if (-not (Test-Path "inno\Output\honk300-${{ matrix.triple }}-setup.exe")) {
            throw "Global EXE installer output missing"
          }

      - name: Build Corporate EXE installer
        shell: pwsh
        run: |
          $payloadSha256 = (Get-FileHash -LiteralPath 'target\${{ matrix.triple }}\release\honk300.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          & "C:\Program Files (x86)\Inno Setup 6\iscc.exe" `
            "/DMyAppVersion=${{ steps.tag.outputs.version }}" `
            "/DReleaseTag=${{ inputs.tag }}" `
            "/DReleaseCommit=${{ inputs.commit }}" `
            "/DPayloadSha256=$payloadSha256" `
            "/DTargetTriple=${{ matrix.triple }}" `
            "/DSourceBinDir=..\target\${{ matrix.triple }}\release" `
            "/DInnoArchitecturesAllowed=${{ matrix.inno_arch }}" `
            inno\corporate.iss
          if (-not (Test-Path "inno\Output\honk300-${{ matrix.triple }}-corporate-setup.exe")) {
            throw "Corporate EXE installer output missing"
          }

      - name: Qualify real x64 four-family takeover ordering
        if: ${{ matrix.triple == 'x86_64-pc-windows-msvc' }}
        shell: pwsh
        run: |
          ./script/smoke_windows_installer_takeover.ps1 `
            -GlobalMsi target/wix/honk300-${{ matrix.triple }}.msi `
            -CorporateMsi target/wix/honk300-${{ matrix.triple }}-corporate.msi `
            -GlobalExe inno/Output/honk300-${{ matrix.triple }}-setup.exe `
            -CorporateExe inno/Output/honk300-${{ matrix.triple }}-corporate-setup.exe `
            -ExpectedVersion '${{ steps.tag.outputs.version }}' `
            -EvidenceDirectory target/windows-installer-takeover-evidence-${{ matrix.triple }} `
            -AllowMachineMutation

      - name: Upload real x64 installer takeover evidence
        if: ${{ always() && matrix.triple == 'x86_64-pc-windows-msvc' }}
        uses: actions/upload-artifact@v6
        with:
          name: qualification-windows-installer-takeover-${{ matrix.triple }}
          path: target/windows-installer-takeover-evidence-${{ matrix.triple }}
          if-no-files-found: error
          retention-days: 7

      - name: Smoke Global MSI legacy migration, slot repair, and uninstall
        if: ${{ matrix.triple == 'x86_64-pc-windows-msvc' }}
        shell: pwsh
        run: |
          $msi = (Resolve-Path "target\wix\honk300-${{ matrix.triple }}.msi").Path
          $oldMsi = Join-Path $env:RUNNER_TEMP 'honk300-v0.2.1-x86_64-global.msi'
          Invoke-WebRequest -UseBasicParsing `
            'https://github.com/RealEmmettS/goose/releases/download/v0.2.1/honk300-x86_64-pc-windows-msvc.msi' `
            -OutFile $oldMsi
          $oldHash = (Get-FileHash -LiteralPath $oldMsi -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($oldHash -ne '9566f3cc4c97fd16b087f72f16aedf0f80e1044868f2c0694329b4462929e022') {
            throw "v0.2.1 MSI hash mismatch: $oldHash"
          }
          $msiexec = Join-Path ([Environment]::GetFolderPath([Environment+SpecialFolder]::System)) 'msiexec.exe'
          function Invoke-Msi([string] $mode, [string] $path) {
            $process = Start-Process $msiexec -ArgumentList @($mode, "`"$path`"", '/qn', '/norestart') -WindowStyle Hidden -Wait -PassThru
            if ($process.ExitCode -notin @(0, 3010)) {
              throw "MSI $mode $path failed with $($process.ExitCode)"
            }
          }

          Invoke-Msi '/i' $oldMsi
          $binary = Join-Path $env:ProgramFiles "honk300\bin\honk300.exe"
          if (-not (Test-Path $binary -PathType Leaf)) { throw "v0.2.1 MSI did not install $binary" }
          $oldReported = (& $binary --version | Select-Object -Last 1).Trim()
          if ($oldReported -notmatch '0\.2\.1$') { throw "v0.2.1 install mismatch: $oldReported" }

          Invoke-Msi '/i' $msi
          $reported = (& $binary --version | Select-Object -Last 1).Trim()
          if ($reported -notmatch "${{ steps.tag.outputs.version }}$") { throw "Upgrade mismatch: $reported" }
          python script/verify_binary_architecture.py --format pe --machine 0x8664 --subsystem 3 $binary
          if ($LASTEXITCODE -ne 0) { throw 'installed x64 PE identity check failed' }
          $sourceHash = (Get-FileHash -LiteralPath 'target/${{ matrix.triple }}/release/honk300.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          $installedHash = (Get-FileHash -LiteralPath $binary -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($installedHash -ne $sourceHash) { throw 'installed MSI binary does not match exact qualified build' }
          $launcher = Join-Path $env:ProgramFiles 'honk300\bin\honk300-app.exe'
          python script/verify_binary_architecture.py --format pe --machine 0x8664 --subsystem 2 $launcher
          if ($LASTEXITCODE -ne 0) { throw 'installed x64 app launcher is not GUI-subsystem PE' }
          $sourceLauncherHash = (Get-FileHash -LiteralPath 'target/${{ matrix.triple }}/release/honk300-app.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          $installedLauncherHash = (Get-FileHash -LiteralPath $launcher -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($installedLauncherHash -ne $sourceLauncherHash) { throw 'installed MSI app launcher does not match exact qualified build' }

          Invoke-Msi '/fa' $msi
          $receipt = Join-Path $env:ProgramFiles 'honk300\install-receipt.json'
          $receiptValue = Get-Content -LiteralPath $receipt -Raw | ConvertFrom-Json
          if ($receiptValue.schema -ne 'honk300.install.v2' -or $receiptValue.origin -ne 'msi-global') {
            throw 'slot receipt did not preserve Global MSI provenance'
          }
          if ($receiptValue.app_launcher.path -ne $launcher -or $receiptValue.app_launcher.sha256 -ne $installedLauncherHash) {
            throw 'slot receipt did not bind the exact windowless app launcher'
          }
          if (-not (Test-Path (Join-Path $env:ProgramFiles 'honk300\current') -PathType Container)) {
            throw 'stable current junction is missing'
          }
          foreach ($alias in @('honk300.exe','honk.exe','goose.exe')) {
            $aliasPath = Join-Path $env:ProgramFiles "honk300\bin\$alias"
            $aliasVersion = (& $aliasPath --version | Select-Object -Last 1).Trim()
            if ($aliasVersion -notmatch "${{ steps.tag.outputs.version }}$") { throw "$alias was not activated" }
          }

          Invoke-Msi '/x' $msi
          if (Test-Path $binary -PathType Leaf) { throw "MSI uninstall left the executable behind" }
          if (Test-Path $launcher -PathType Leaf) { throw "MSI uninstall left the app launcher behind" }

      - name: Stage exact ARM64 MSI and build for native qualification
        if: ${{ matrix.triple == 'aarch64-pc-windows-msvc' }}
        shell: pwsh
        run: |
          $stage = 'target/qualification-input-aarch64-pc-windows-msvc'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item -LiteralPath 'target/${{ matrix.triple }}/release/honk300.exe' `
            -Destination (Join-Path $stage 'honk300.exe')
          Copy-Item -LiteralPath 'target/${{ matrix.triple }}/release/honk300-app.exe' `
            -Destination (Join-Path $stage 'honk300-app.exe')
          Copy-Item -LiteralPath 'target/wix/honk300-${{ matrix.triple }}.msi' `
            -Destination (Join-Path $stage 'honk300-${{ matrix.triple }}.msi')
          Copy-Item -LiteralPath 'target/wix/honk300-${{ matrix.triple }}-corporate.msi' `
            -Destination (Join-Path $stage 'honk300-${{ matrix.triple }}-corporate.msi')
          Copy-Item -LiteralPath 'inno/Output/honk300-${{ matrix.triple }}-setup.exe' `
            -Destination (Join-Path $stage 'honk300-${{ matrix.triple }}-setup.exe')
          Copy-Item -LiteralPath 'inno/Output/honk300-${{ matrix.triple }}-corporate-setup.exe' `
            -Destination (Join-Path $stage 'honk300-${{ matrix.triple }}-corporate-setup.exe')

      - name: Upload exact ARM64 MSI and build for native qualification
        if: ${{ matrix.triple == 'aarch64-pc-windows-msvc' }}
        uses: actions/upload-artifact@v6
        with:
          name: qualification-input-windows-aarch64-pc-windows-msvc
          path: target/qualification-input-aarch64-pc-windows-msvc
          if-no-files-found: error
          retention-days: 7

      - name: Collect release artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force target\release-artifacts | Out-Null
          Copy-Item "target\wix\honk300-${{ matrix.triple }}.msi" target\release-artifacts\
          Copy-Item "target\wix\honk300-${{ matrix.triple }}-corporate.msi" target\release-artifacts\
          Copy-Item "inno\Output\honk300-${{ matrix.triple }}-setup.exe" target\release-artifacts\
          Copy-Item "inno\Output\honk300-${{ matrix.triple }}-corporate-setup.exe" target\release-artifacts\

      - name: Upload platform artifacts to the release orchestrator
        uses: actions/upload-artifact@v6
        with:
          name: release-windows-${{ matrix.triple }}
          path: target/release-artifacts/*
          if-no-files-found: error
          retention-days: 7

  qualify-windows-arm64-native:
    name: aarch64-pc-windows-msvc native compositor qualification
    needs: build-windows-installers
    runs-on: windows-11-arm
    steps:
      - name: Enable Windows long paths
        shell: pwsh
        run: git config --global core.longpaths true

      - name: Validate release identity inputs
        shell: pwsh
        run: |
          if ("${{ inputs.tag }}" -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') {
            throw "Expected a stable vMAJOR.MINOR.PATCH tag, got '${{ inputs.tag }}'"
          }
          if ("${{ inputs.commit }}" -notmatch '^[0-9a-fA-F]{40}$') {
            throw "Expected a full commit SHA, got '${{ inputs.commit }}'"
          }

      - name: Checkout exact release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove tag and checkout identify the same commit
        shell: pwsh
        env:
          CANDIDATE: ${{ inputs.candidate }}
          SAME_SHA_MAIN: ${{ inputs.same_sha_main }}
        run: |
          git fetch --force --tags origin
          $head = (git rev-parse HEAD).Trim()
          if ($head -ne "${{ inputs.commit }}") {
            throw "Requested commit and checkout do not match"
          }
          $tagExists = [bool](git tag --list "${{ inputs.tag }}")
          if ($env:CANDIDATE -eq 'true') {
            if ($tagExists -and $env:SAME_SHA_MAIN -ne 'true') {
              throw "Candidate tag already exists; use release mode or a new patch version"
            }
          } else {
            if (-not $tagExists) { throw "Release tag does not exist" }
            $tagCommit = (git rev-parse "${{ inputs.tag }}^{commit}").Trim()
            if ($tagCommit -ne $head) {
              throw "Tag, requested commit, and checkout do not match"
            }
          }

      - name: Download exact ARM64 executable produced for packaging
        uses: actions/download-artifact@v6
        with:
          name: qualification-input-windows-aarch64-pc-windows-msvc
          path: target/qualification-input-aarch64-pc-windows-msvc

      - name: Prove native ARM64 host
        shell: pwsh
        run: |
          if ($env:PROCESSOR_ARCHITECTURE -ne 'ARM64') {
            throw "Expected a native ARM64 Windows runner, got '$env:PROCESSOR_ARCHITECTURE'"
          }
          $binary = 'target/qualification-input-aarch64-pc-windows-msvc/honk300.exe'
          $launcher = 'target/qualification-input-aarch64-pc-windows-msvc/honk300-app.exe'
          if (-not (Test-Path -LiteralPath $binary -PathType Leaf)) {
            throw "Exact packaged ARM64 executable is missing: $binary"
          }
          $msi = 'target/qualification-input-aarch64-pc-windows-msvc/honk300-aarch64-pc-windows-msvc.msi'
          if (-not (Test-Path -LiteralPath $msi -PathType Leaf)) {
            throw "Exact packaged ARM64 MSI is missing: $msi"
          }
          python script/verify_binary_architecture.py --format pe --machine 0xAA64 --subsystem 3 $binary
          if ($LASTEXITCODE -ne 0) { throw 'ARM64 CLI PE identity check failed' }
          python script/verify_binary_architecture.py --format pe --machine 0xAA64 --subsystem 2 $launcher
          if ($LASTEXITCODE -ne 0) { throw 'ARM64 app-launcher PE identity check failed' }

      - name: Qualify all four slot origins with a live native ARM64 process
        shell: pwsh
        run: >-
          ./script/smoke_windows_slot_update.ps1
          -Binary target/qualification-input-aarch64-pc-windows-msvc/honk300.exe
          -AppLauncher target/qualification-input-aarch64-pc-windows-msvc/honk300-app.exe
          -TargetTriple aarch64-pc-windows-msvc
          -EvidenceDirectory target/windows-slot-update-evidence-arm64

      - name: Qualify real native ARM64 four-family takeover ordering
        shell: pwsh
        run: |
          $stage = 'target/qualification-input-aarch64-pc-windows-msvc'
          $version = ('${{ inputs.tag }}').TrimStart('v')
          ./script/smoke_windows_installer_takeover.ps1 `
            -GlobalMsi (Join-Path $stage 'honk300-aarch64-pc-windows-msvc.msi') `
            -CorporateMsi (Join-Path $stage 'honk300-aarch64-pc-windows-msvc-corporate.msi') `
            -GlobalExe (Join-Path $stage 'honk300-aarch64-pc-windows-msvc-setup.exe') `
            -CorporateExe (Join-Path $stage 'honk300-aarch64-pc-windows-msvc-corporate-setup.exe') `
            -ExpectedVersion $version `
            -EvidenceDirectory target/windows-installer-takeover-evidence-arm64 `
            -AllowMachineMutation

      - name: Upload native ARM64 slot transaction evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: qualification-windows-slot-update-aarch64-pc-windows-msvc
          path: target/windows-slot-update-evidence-arm64
          if-no-files-found: error
          retention-days: 7

      - name: Upload native ARM64 installer takeover evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: qualification-windows-installer-takeover-aarch64-pc-windows-msvc
          path: target/windows-installer-takeover-evidence-arm64
          if-no-files-found: error
          retention-days: 7

      - name: Qualify exact native ARM64 MSI rollback, identity, overlay, and lifecycle
        shell: pwsh
        run: |
          ./script/smoke_released_windows.ps1 `
            -Tag '${{ inputs.tag }}' `
            -TargetTriple aarch64-pc-windows-msvc `
            -CurrentMsiPath target/qualification-input-aarch64-pc-windows-msvc/honk300-aarch64-pc-windows-msvc.msi `
            -SourceBinaryPath target/qualification-input-aarch64-pc-windows-msvc/honk300.exe `
            -OverlayEvidenceDirectory target/windows-overlay-evidence-arm64

      - name: Upload native ARM64 overlay qualification evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: qualification-windows-overlay-aarch64-pc-windows-msvc
          path: target/windows-overlay-evidence-arm64
          if-no-files-found: error
          retention-days: 7
