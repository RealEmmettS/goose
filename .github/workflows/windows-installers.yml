name: Windows Installers

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      commit:
        required: true
        type: string
      candidate:
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      tag:
        description: "Immutable stable release tag, for example v0.3.0"
        required: true
        type: string
      commit:
        description: "Full 40-character commit SHA named by the tag"
        required: true
        type: string
      candidate:
        description: "Build and verify before the tag exists"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  build-windows-installers:
    name: ${{ matrix.triple }} extra installers
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - triple: x86_64-pc-windows-msvc
            wix_arch: x64
            inno_arch: x64
            vcvars_arch: x64
          - triple: aarch64-pc-windows-msvc
            wix_arch: arm64
            inno_arch: arm64
            vcvars_arch: x64_arm64

    steps:
      - name: Enable Windows long paths
        shell: pwsh
        run: git config --global core.longpaths true

      - name: Resolve target tag
        id: tag
        shell: pwsh
        run: |
          $tag = "${{ inputs.tag }}"
          $commit = "${{ inputs.commit }}"
          if ($tag -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') {
            throw "Expected a stable vMAJOR.MINOR.PATCH tag, got '$tag'"
          }
          if ($commit -notmatch '^[0-9a-fA-F]{40}$') {
            throw "Expected a full commit SHA, got '$commit'"
          }
          $version = $tag -replace '^v', ''
          Add-Content -Path $env:GITHUB_OUTPUT -Value "tag=$tag"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$version"

      - name: Checkout exact release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove tag and checkout identify the same commit
        shell: pwsh
        env:
          CANDIDATE: ${{ inputs.candidate }}
        run: |
          git fetch --force --tags origin
          $head = (git rev-parse HEAD).Trim()
          if ($head -ne "${{ inputs.commit }}") {
            throw "Requested commit and checkout do not match"
          }
          git show-ref --verify --quiet "refs/tags/${{ inputs.tag }}" *> $null
          $tagExists = $LASTEXITCODE -eq 0
          if ($env:CANDIDATE -eq 'true') {
            if ($tagExists) {
              throw "Candidate tag already exists; use release mode or a new patch version"
            }
          } else {
            if (-not $tagExists) { throw "Release tag does not exist" }
            $tagCommit = (git rev-parse "${{ inputs.tag }}^{commit}").Trim()
            if ($tagCommit -ne $head) {
              throw "Tag, requested commit, and checkout do not match"
            }
          }

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.95.0
          targets: ${{ matrix.triple }}

      - name: Install target for pinned toolchain
        shell: pwsh
        run: rustup target add ${{ matrix.triple }}

      - name: Ensure ARM64 MSVC build tools
        if: ${{ matrix.triple == 'aarch64-pc-windows-msvc' }}
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw "vswhere.exe not found at $vswhere" }

          $installPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installPath) { throw "Visual Studio C++ x64/x86 tools are not installed" }

          $arm64Path = & $vswhere -products * -requires Microsoft.VisualStudio.Component.VC.Tools.ARM64 -property installationPath
          if (-not $arm64Path) {
            $setup = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
            if (-not (Test-Path $setup)) { throw "Visual Studio setup.exe not found at $setup" }
            $args = @(
              "modify",
              "--installPath", $installPath,
              "--add", "Microsoft.VisualStudio.Component.VC.Tools.ARM64",
              "--quiet",
              "--norestart",
              "--nocache"
            )
            $proc = Start-Process -FilePath $setup -ArgumentList $args -Wait -PassThru
            if ($proc.ExitCode -ne 0 -and $proc.ExitCode -ne 3010) {
              throw "Visual Studio ARM64 tools install failed with exit $($proc.ExitCode)"
            }
          }

          $arm64Path = & $vswhere -products * -requires Microsoft.VisualStudio.Component.VC.Tools.ARM64 -property installationPath
          if (-not $arm64Path) { throw "Visual Studio ARM64 tools are still unavailable after install" }

      - name: Build honk300.exe
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installPath) { throw "Visual Studio C++ tools are not installed" }
          $vcvars = Join-Path $installPath "VC\Auxiliary\Build\vcvarsall.bat"
          if (-not (Test-Path $vcvars)) { throw "vcvarsall.bat not found at $vcvars" }
          $cmd = 'call "' + $vcvars + '" ${{ matrix.vcvars_arch }} && cargo build --release --locked --target ${{ matrix.triple }}'
          cmd.exe /c $cmd
          if ($LASTEXITCODE -ne 0) { throw "cargo build failed with exit $LASTEXITCODE" }

      - name: Build Global and Corporate MSI
        shell: pwsh
        run: |
          $candle = "$env:WIX\bin\candle.exe"
          $light  = "$env:WIX\bin\light.exe"
          if (-not (Test-Path $candle)) { throw "candle.exe not found at $candle" }
          if (-not (Test-Path $light))  { throw "light.exe not found at $light" }
          $binDir = "target\${{ matrix.triple }}\release"
          $sourceRoot = (Get-Location).Path
          New-Item -ItemType Directory -Force -Path target\wix | Out-Null
          & $candle -arch ${{ matrix.wix_arch }} `
            "-dVersion=${{ steps.tag.outputs.version }}" `
            "-dCargoTargetBinDir=$binDir" `
            "-dSourceRoot=$sourceRoot" `
            -out target\wix\corporate.wixobj `
            wix-corporate\corporate.wxs
          if ($LASTEXITCODE -ne 0) { throw "corporate candle failed with exit $LASTEXITCODE" }
          & $candle -arch ${{ matrix.wix_arch }} `
            "-dVersion=${{ steps.tag.outputs.version }}" `
            "-dCargoTargetBinDir=$binDir" `
            "-dSourceRoot=$sourceRoot" `
            -out target\wix\global.wixobj `
            wix\main.wxs
          if ($LASTEXITCODE -ne 0) { throw "global candle failed with exit $LASTEXITCODE" }
          & $light -sice:ICE38 -sice:ICE64 -sice:ICE91 `
            -ext WixUIExtension `
            -out target\wix\honk300-${{ matrix.triple }}.msi `
            target\wix\global.wixobj
          if ($LASTEXITCODE -ne 0) { throw "global light failed with exit $LASTEXITCODE" }
          & $light -sice:ICE38 -sice:ICE64 -sice:ICE91 `
            -ext WixUIExtension `
            -out target\wix\honk300-${{ matrix.triple }}-corporate.msi `
            target\wix\corporate.wixobj
          if ($LASTEXITCODE -ne 0) { throw "light failed with exit $LASTEXITCODE" }

      - name: Install Inno Setup 6
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress --no-color
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\iscc.exe")) {
            throw "Inno Setup install failed; iscc.exe missing"
          }

      - name: Build Global EXE installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\iscc.exe" `
            "/DMyAppVersion=${{ steps.tag.outputs.version }}" `
            "/DTargetTriple=${{ matrix.triple }}" `
            "/DSourceBinDir=..\target\${{ matrix.triple }}\release" `
            "/DInnoArchitecturesAllowed=${{ matrix.inno_arch }}" `
            inno\global.iss
          if (-not (Test-Path "inno\Output\honk300-${{ matrix.triple }}-setup.exe")) {
            throw "Global EXE installer output missing"
          }

      - name: Build Corporate EXE installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\iscc.exe" `
            "/DMyAppVersion=${{ steps.tag.outputs.version }}" `
            "/DTargetTriple=${{ matrix.triple }}" `
            "/DSourceBinDir=..\target\${{ matrix.triple }}\release" `
            "/DInnoArchitecturesAllowed=${{ matrix.inno_arch }}" `
            inno\corporate.iss
          if (-not (Test-Path "inno\Output\honk300-${{ matrix.triple }}-corporate-setup.exe")) {
            throw "Corporate EXE installer output missing"
          }

      - name: Smoke Global MSI upgrade, repair, downgrade refusal, and uninstall
        if: ${{ matrix.triple == 'x86_64-pc-windows-msvc' }}
        shell: pwsh
        run: |
          $msi = (Resolve-Path "target\wix\honk300-${{ matrix.triple }}.msi").Path
          $oldMsi = Join-Path $env:RUNNER_TEMP 'honk300-v0.2.1-x86_64-global.msi'
          Invoke-WebRequest -UseBasicParsing `
            'https://github.com/RealEmmettS/goose/releases/download/v0.2.1/honk300-x86_64-pc-windows-msvc.msi' `
            -OutFile $oldMsi
          $oldHash = (Get-FileHash -LiteralPath $oldMsi -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($oldHash -ne '9566f3cc4c97fd16b087f72f16aedf0f80e1044868f2c0694329b4462929e022') {
            throw "v0.2.1 MSI hash mismatch: $oldHash"
          }
          $msiexec = Join-Path ([Environment]::GetFolderPath([Environment+SpecialFolder]::System)) 'msiexec.exe'
          function Invoke-Msi([string] $mode, [string] $path) {
            $process = Start-Process $msiexec -ArgumentList @($mode, "`"$path`"", '/qn', '/norestart') -Wait -PassThru
            if ($process.ExitCode -notin @(0, 3010)) {
              throw "MSI $mode $path failed with $($process.ExitCode)"
            }
          }

          Invoke-Msi '/i' $oldMsi
          $binary = Join-Path $env:ProgramFiles "honk300\bin\honk300.exe"
          if (-not (Test-Path $binary -PathType Leaf)) { throw "v0.2.1 MSI did not install $binary" }
          $oldReported = (& $binary --version | Select-Object -Last 1).Trim()
          if ($oldReported -notmatch '0\.2\.1$') { throw "v0.2.1 install mismatch: $oldReported" }

          Invoke-Msi '/i' $msi
          $reported = (& $binary --version | Select-Object -Last 1).Trim()
          if ($reported -notmatch "${{ steps.tag.outputs.version }}$") { throw "Upgrade mismatch: $reported" }

          Invoke-Msi '/fa' $msi
          $downgrade = Start-Process $msiexec -ArgumentList @('/i', "`"$oldMsi`"", '/qn', '/norestart') -Wait -PassThru
          if ($downgrade.ExitCode -in @(0, 3010)) { throw 'Downgrade unexpectedly succeeded' }
          $afterDowngrade = (& $binary --version | Select-Object -Last 1).Trim()
          if ($afterDowngrade -notmatch "${{ steps.tag.outputs.version }}$") {
            throw "Rejected downgrade changed the installed version: $afterDowngrade"
          }

          Invoke-Msi '/x' $msi
          if (Test-Path $binary -PathType Leaf) { throw "MSI uninstall left the executable behind" }

      - name: Smoke ARM64 MSI administrative extraction
        if: ${{ matrix.triple == 'aarch64-pc-windows-msvc' }}
        shell: pwsh
        run: |
          $msi = (Resolve-Path "target\wix\honk300-${{ matrix.triple }}.msi").Path
          $stage = Join-Path $env:RUNNER_TEMP 'arm64-msi-layout'
          $msiexec = Join-Path ([Environment]::GetFolderPath([Environment+SpecialFolder]::System)) 'msiexec.exe'
          $process = Start-Process $msiexec -ArgumentList @('/a', "`"$msi`"", '/qn', "TARGETDIR=`"$stage`"") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "ARM64 MSI administrative extraction failed with $($process.ExitCode)" }
          if (-not (Get-ChildItem $stage -Recurse -Filter honk300.exe)) { throw "ARM64 MSI does not contain honk300.exe" }

      - name: Collect release artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force target\release-artifacts | Out-Null
          Copy-Item "target\wix\honk300-${{ matrix.triple }}.msi" target\release-artifacts\
          Copy-Item "target\wix\honk300-${{ matrix.triple }}-corporate.msi" target\release-artifacts\
          Copy-Item "inno\Output\honk300-${{ matrix.triple }}-setup.exe" target\release-artifacts\
          Copy-Item "inno\Output\honk300-${{ matrix.triple }}-corporate-setup.exe" target\release-artifacts\

      - name: Upload platform artifacts to the release orchestrator
        uses: actions/upload-artifact@v6
        with:
          name: release-windows-${{ matrix.triple }}
          path: target/release-artifacts/*
          if-no-files-found: error
          retention-days: 7
