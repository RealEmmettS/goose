name: Native KWin companion

on:
  workflow_dispatch:
  push:
    branches: [codex/goose-wayland-integrations]
    paths: ['integrations/kwin/**', 'crates/honk-platform-linux/**', 'Cargo.lock', 'script/smoke_kwin*', '.github/workflows/kwin-probe.yml']

permissions:
  contents: read

jobs:
  native:
    name: KWin (${{ matrix.distribution }}, ${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        distribution: ['ubuntu:24.04', 'debian:trixie-slim']
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: '1.95'
      - name: Build and check the actual Rust KWin boundary
        run: |
          cargo test --locked -p honk-platform-linux --lib
          cargo clippy --locked -p honk-platform-linux --all-targets -- -D warnings
          cargo build --locked -p honk-platform-linux --example kwin_bridge_probe
      - name: Exercise the real isolated compositor and script
        env:
          HONK_DISTRIBUTION: ${{ matrix.distribution }}
        run: |
          docker run --rm -e GITHUB_ACTIONS -e HONK_HOST_UID="$(id -u)" -e HONK_HOST_GID="$(id -g)" \
            -v "$PWD:/work" -w /work "$HONK_DISTRIBUTION" bash -euc '
            mkdir -p target/kwin-evidence
            trap '\''chown -R "$HONK_HOST_UID:$HONK_HOST_GID" /work/target/kwin-evidence'\'' EXIT
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install --no-install-recommends -y \
              kwin-wayland dbus-x11 python3 python3-gi gir1.2-gtk-4.0 libgtk-4-1 \
              libgl1-mesa-dri mesa-utils wayland-utils libcap2-bin
            dpkg-query -W > target/kwin-evidence/packages.txt
            compositor="$(command -v kwin_wayland)"
            capabilities="$(getcap "$compositor")"
            printf "%s\n" "$capabilities" > target/kwin-evidence/container-file-capabilities.txt
            # The distro requests realtime scheduling through file capabilities.
            # Drop that request for this private software-rendered container;
            # do not grant extra container/host privileges just to launch it.
            if test -n "$capabilities"; then setcap -r "$compositor"; fi
            dbus-run-session -- python3 script/smoke_kwin_companion.py --evidence target/kwin-evidence --bridge target/debug/examples/kwin_bridge_probe
          '
      - uses: actions/upload-artifact@v6
        if: ${{ always() }}
        with:
          name: kwin-${{ strategy.job-index }}
          path: target/kwin-evidence
          if-no-files-found: warn
