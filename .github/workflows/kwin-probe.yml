name: Native KWin companion

on:
  workflow_dispatch:
  push:
    branches: [codex/goose-wayland-integrations]
    paths: ['integrations/kwin/**', 'crates/**', 'src/**', 'settings/**', 'Cargo.lock', 'script/smoke_kwin*', '.github/workflows/kwin-probe.yml']

permissions:
  contents: read

jobs:
  native:
    name: KWin (${{ matrix.distribution }}, ${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        distribution: ['ubuntu:24.04', 'debian:trixie-slim']
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: '1.95'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          architecture: ${{ matrix.runner == 'ubuntu-24.04-arm' && 'arm64' || 'x64' }}
      - name: Build and check the actual Rust KWin boundary
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libasound2-dev
          cargo test --locked -p honk-platform-linux --lib
          cargo test --locked --bin honk300 integrations
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo build --locked --release -p honk-platform-linux --example kwin_bridge_probe
          cargo build --locked --release --bin honk300
      - name: Build the production Native SDK settings companion
        run: |
          sudo apt-get install --no-install-recommends -y libgtk-4-dev pkg-config
          target="$(uname -m)-unknown-linux-gnu"
          python3 script/build_settings.py --target "$target" --output target/release --test
      - name: Exercise the real isolated compositor and script
        env:
          HONK_DISTRIBUTION: ${{ matrix.distribution }}
        run: |
          docker run --rm -e GITHUB_ACTIONS -e HONK_DISTRIBUTION -e HONK_HOST_UID="$(id -u)" -e HONK_HOST_GID="$(id -g)" \
            -v "$PWD:/work" -w /work "$HONK_DISTRIBUTION" bash -euc '
            mkdir -p target/kwin-evidence
            trap '\''chown -R "$HONK_HOST_UID:$HONK_HOST_GID" /work/target/kwin-evidence'\'' EXIT
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install --no-install-recommends -y \
              kwin-wayland dbus-x11 python3 python3-gi gir1.2-gtk-4.0 libgtk-4-1 \
              libgl1-mesa-dri mesa-utils wayland-utils libcap2-bin libasound2t64 \
              at-spi2-core gir1.2-atspi-2.0
            if test "$HONK_DISTRIBUTION" = "debian:trixie-slim"; then
              DEBIAN_FRONTEND=noninteractive apt-get install --no-install-recommends -y \
                kwin-common plasma-workspace xdg-desktop-portal xdg-desktop-portal-kde liboeffis1 libei1 \
                at-spi2-core gir1.2-atspi-2.0 pipewire qt6-wayland
            fi
            dpkg-query -W > target/kwin-evidence/packages.txt
            if test "$HONK_DISTRIBUTION" = "debian:trixie-slim"; then
              dpkg-query -L xdg-desktop-portal-kde > target/kwin-evidence/backend-files.txt
            fi
            compositor="$(command -v kwin_wayland)"
            capabilities="$(getcap "$compositor")"
            printf "%s\n" "$capabilities" > target/kwin-evidence/container-file-capabilities.txt
            # The distro requests realtime scheduling through file capabilities.
            # Drop that request for this private software-rendered container;
            # do not grant extra container/host privileges just to launch it.
            if test -n "$capabilities"; then setcap -r "$compositor"; fi
            dbus-run-session -- python3 script/smoke_kwin_companion.py --evidence target/kwin-evidence --bridge target/release/examples/kwin_bridge_probe --goose target/release/honk300 --settings target/release/honk300-settings --portal
          '
      - uses: actions/upload-artifact@v6
        if: ${{ always() }}
        with:
          name: kwin-${{ strategy.job-index }}
          path: target/kwin-evidence
          if-no-files-found: warn
