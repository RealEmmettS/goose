name: Native GNOME adapter

on:
  workflow_dispatch:
  push:
    branches: [codex/goose-gnome-integration]
    paths: ['script/smoke_gnome*', 'script/fixtures/gnome-probe/**', '.github/workflows/gnome-probe.yml']

permissions:
  contents: read

jobs:
  premise:
    name: GNOME (${{ matrix.distribution }}, ${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        distribution: ['ubuntu:24.04', 'debian:trixie-slim']
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: '1.95'
      - name: Build the actual goose for the overlay premise
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libasound2-dev
          cargo build --locked --release --bin honk300
      - name: Exercise the actual private Shell and extension
        env:
          HONK_DISTRIBUTION: ${{ matrix.distribution }}
        run: |
          docker run --rm -e HONK_HOST_UID="$(id -u)" -e HONK_HOST_GID="$(id -g)" \
            -v "$PWD:/work" -w /work "$HONK_DISTRIBUTION" bash -euc '
            mkdir -p target/gnome-evidence
            trap '\''chown -R "$HONK_HOST_UID:$HONK_HOST_GID" /work/target/gnome-evidence'\'' EXIT
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install --no-install-recommends -y \
              gnome-shell gnome-session-bin dbus-x11 python3 python3-gi gir1.2-gtk-4.0 \
              libgl1-mesa-dri libegl-mesa0 xvfb xauth xwayland wayland-utils imagemagick \
              util-linux passwd libasound2t64 dconf-cli
            dpkg-query -W > target/gnome-evidence/packages.txt
            # Package installation may create an empty seats directory even
            # though this private container has no systemd/login session. Keep
            # GNOME on its normal no-logind path; never substitute a fake service.
            if test -d /run/systemd/seats; then rmdir /run/systemd/seats; fi
            mkdir -p /run/dbus
            dbus-daemon --system --fork
            useradd --create-home honkprobe
            chown -R honkprobe:honkprobe /work/target/gnome-evidence
            runuser -u honkprobe -- env GITHUB_ACTIONS=true xvfb-run -a -s "-screen 0 1400x1000x24" \
              dbus-run-session -- python3 script/smoke_gnome_adapter.py \
                --evidence target/gnome-evidence --goose target/release/honk300
          '
      - uses: actions/upload-artifact@v6
        if: ${{ always() }}
        with:
          name: gnome-${{ strategy.job-index }}
          path: target/gnome-evidence
          if-no-files-found: warn
