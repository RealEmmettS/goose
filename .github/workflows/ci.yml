name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-and-release-contracts:
    name: Dependency audit and release contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install pinned cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Required dependency audit
        run: cargo audit
      - name: Release metadata tests
        run: python3 -m unittest discover -s script/tests -p 'test_release_metadata.py' -v
      - name: Installer template tests
        run: python3 -m unittest discover -s script/tests -p 'test_installer_templates.py' -v
      - name: Debian packaging contract tests
        run: python3 -m unittest discover -s script/tests -p 'test_debian_packaging.py' -v
      - name: macOS packaging contract tests
        run: python3 -m unittest discover -s script/tests -p 'test_macos_packaging.py' -v
      - name: Windows packaging contract tests
        run: python3 -m unittest discover -s script/tests -p 'test_windows_packaging.py' -v
      - name: Windows overlay capture analyzer tests
        run: python3 -m unittest discover -s script/tests -p 'test_windows_overlay_smoke.py' -v
      - name: Linux overlay capture analyzer tests
        run: python3 -m unittest discover -s script/tests -p 'test_linux_overlay_smoke.py' -v
      - name: Binary architecture verifier tests
        run: python3 -m unittest discover -s script/tests -p 'test_verify_binary_architecture.py' -v
      - name: Atomic workflow contract tests
        run: python3 -m unittest discover -s script/tests -p 'test_release_workflows.py' -v

  windows:
    name: Windows host gate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust targets
        run: rustup target add x86_64-pc-windows-msvc aarch64-pc-windows-msvc
      - name: Format
        run: cargo fmt --all -- --check
      - name: Test
        run: cargo test --workspace
      - name: Clippy
        run: cargo clippy --all-targets --workspace -- -D warnings
      - name: Release build
        run: cargo build --release
      - name: Prove x64 PE identity
        shell: pwsh
        run: |
          python script/verify_binary_architecture.py --format pe --machine 0x8664 target/release/honk300.exe
          if ($LASTEXITCODE -ne 0) { throw 'x64 PE identity check failed' }
      - name: Windows layered-overlay compositor and lifecycle smoke
        shell: pwsh
        run: >-
          ./script/smoke_windows_overlay.ps1
          -Binary target/release/honk300.exe
          -EvidenceDirectory target/windows-overlay-evidence
      - name: Upload Windows overlay qualification evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: honk300-windows-overlay-ci
          path: target/windows-overlay-evidence
          if-no-files-found: error
      - name: Windows target checks
        run: |
          cargo check --workspace --target x86_64-pc-windows-msvc
          cargo check --workspace --target aarch64-pc-windows-msvc

  windows-arm64-overlay:
    name: Windows ARM64 native overlay gate
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v6
      - name: Set up native ARM64 Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.95.0
          targets: aarch64-pc-windows-msvc
      - name: Prove native ARM64 host
        shell: pwsh
        run: |
          if ($env:PROCESSOR_ARCHITECTURE -ne 'ARM64') {
            throw "Expected a native ARM64 Windows runner, got '$env:PROCESSOR_ARCHITECTURE'"
          }
          $version = rustc -vV | Out-String
          if ($version -notmatch '(?m)^host: aarch64-pc-windows-msvc\s*$') {
            throw "Rust toolchain is not native ARM64:`n$version"
          }
      - name: Native ARM64 tests and release build
        run: |
          cargo test --workspace --locked --target aarch64-pc-windows-msvc
          cargo build --release --locked --target aarch64-pc-windows-msvc --bin honk300
      - name: ARM64 layered-overlay compositor and lifecycle smoke
        shell: pwsh
        run: |
          python script/verify_binary_architecture.py `
            --format pe `
            --machine 0xAA64 `
            target/aarch64-pc-windows-msvc/release/honk300.exe
          ./script/smoke_windows_overlay.ps1 `
            -Binary target/aarch64-pc-windows-msvc/release/honk300.exe `
            -EvidenceDirectory target/windows-overlay-evidence-arm64
      - name: Upload Windows ARM64 overlay qualification evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: honk300-windows-overlay-arm64-ci
          path: target/windows-overlay-evidence-arm64
          if-no-files-found: error

  macos:
    name: macOS bundle smoke (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner:
          - macos-15
          - macos-15-intel
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust targets
        run: rustup target add x86_64-apple-darwin aarch64-apple-darwin
      - name: Test
        run: cargo test --workspace
      - name: macOS bundle smoke
        run: bash script/smoke_m16_macos.sh
      - name: Archive universal2 app
        run: ditto -c -k --keepParent target/dist/macos-universal2/Honk300.app "Honk300-${{ matrix.runner }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: "honk300-macos-${{ matrix.runner }}"
          path: "Honk300-${{ matrix.runner }}.zip"

  macos-accessibility:
    name: macOS Accessibility smoke
    if: ${{ vars.HONK300_RUN_A11Y_SMOKE == 'true' }}
    runs-on: [self-hosted, macOS, ARM64, honk300-a11y]
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust targets
        run: rustup target add x86_64-apple-darwin aarch64-apple-darwin
      - name: Accessibility smoke
        run: bash script/smoke_m16_macos_accessibility.sh

  linux:
    name: Linux visible smoke (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            gnu_target: x86_64-unknown-linux-gnu
            musl_target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            gnu_target: aarch64-unknown-linux-gnu
            musl_target: aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v6
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev xvfb openbox x11-utils x11-xserver-utils imagemagick xcompmgr python3 sway grim
      - name: Install Rust targets
        run: rustup target add ${{ matrix.gnu_target }} ${{ matrix.musl_target }}
      - name: Test
        run: cargo test --workspace
      - name: Linux X11 and Wayland smoke
        run: |
          cargo build --locked --bin honk300
          HONK300_BIN="$PWD/target/debug/honk300" \
          HONK300_EVIDENCE_DIR="$PWD/target/linux-overlay-evidence-${{ matrix.gnu_target }}" \
            bash script/smoke_m17_m18_linux.sh
      - name: Upload Linux compositor qualification evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: honk300-linux-overlay-ci-${{ matrix.gnu_target }}
          path: target/linux-overlay-evidence-${{ matrix.gnu_target }}
          if-no-files-found: error
      - name: Linux target checks
        env:
          PKG_CONFIG_ALLOW_CROSS: "1"
        run: |
          cargo check --workspace --target ${{ matrix.gnu_target }}
          cargo check --workspace --target ${{ matrix.musl_target }}
