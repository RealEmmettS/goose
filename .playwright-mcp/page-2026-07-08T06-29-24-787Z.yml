        - paragraph [ref=e398]: Capabilities and manners
        - heading "Mischief with boundaries" [level=2] [ref=e399]
        - paragraph [ref=e400]: honk300 keeps the odd desktop energy, but reports capability gaps honestly and protects the places people do serious work.
      - generic [ref=e401]:
        - article [ref=e402]:
          - img [ref=e403]
          - heading "Terminal protection" [level=3] [ref=e406]
          - paragraph [ref=e407]: Terminal windows are visible to the goose, but never targets for focus, typing, dragging, riding, or collect-window actions.
        - article [ref=e408]:
          - img [ref=e409]
          - heading "Calm Goose" [level=3] [ref=e413]
          - paragraph [ref=e414]: A real config switch for quieter sessions that disables surprise disruptions while keeping the goose present.
        - article [ref=e415]:
          - img [ref=e416]
          - heading "Quiet hours and presence" [level=3] [ref=e418]
          - paragraph [ref=e419]: Quiet hours, DND, and fullscreen focus calm the goose down instead of interrupting work, streams, or games.
        - article [ref=e420]:
          - img [ref=e421]
          - heading "X11-first Linux" [level=3] [ref=e423]
          - paragraph [ref=e424]: Linux defaults to X11 or XWayland when available. Native Wayland is explicit reduced mode with unsupported capabilities reported honestly.
        - article [ref=e425]:
