          - heading "Terminal protection" [level=3] [ref=f2e406]
          - paragraph [ref=f2e407]: Terminal windows are visible to the goose, but never targets for focus, typing, dragging, riding, or collect-window actions.
        - article [ref=f2e408]:
          - img [ref=f2e409]
