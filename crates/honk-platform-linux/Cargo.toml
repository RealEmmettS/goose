[package]
name = "honk-platform-linux"
version = "0.0.0"
description = "Linux platform helpers for honk300"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
honk-control = { path = "../honk-control" }
honk-engine = { path = "../honk-engine" }
libc = "0.2"
tiny-skia.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }

[target.'cfg(target_os = "linux")'.dependencies]
libloading = "=0.8.9"
smithay-client-toolkit = { version = "0.20.0", default-features = false, features = ["calloop"] }
wayland-client = "0.31.11"
wayland-protocols = { version = "0.32.13", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }
x11rb = { version = "0.13.2", features = ["shape", "xfixes", "xinerama", "randr", "render"] }
ksni = { version = "=0.3.6", default-features = false, features = ["async-io", "blocking"] }

zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }
